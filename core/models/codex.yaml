# ============================================================
# STC model provider — Codex (OpenAI / ChatGPT on macOS)
#
# The MODEL axis, independent of the harness axis. See core/models/claude.yaml
# for the rationale. Codex's current custom-agent TOML contract accepts an
# explicit `model`, so rendered agents pin the Luna default instead of
# inheriting a possibly stale user-level model.
# ============================================================

provider: codex
display_name: "Codex (OpenAI / ChatGPT)"
default_model: "gpt-5.6-luna"
default_reasoning_effort: "max"

api:
  kind: openai
  base_url: "https://api.openai.com"    # default; ChatGPT-app login path differs
  auth: bearer
  key_env: "OPENAI_API_KEY"

# Routine tiers remain on Luna. Terra/Sol are escalation-only overrides and are
# never selected by a routine tier.
tiers:
  fast:  "gpt-5.6-luna"
  mid:   "gpt-5.6-luna"
  heavy: "gpt-5.6-luna"

escalations:
  terra:
    model: "gpt-5.6-terra"
    explicit_only: true
    output_contract: "trigger; why Luna is insufficient; bounded Terra scope; continuation on Luna; FORK/BLOCKED/UNVERIFIED status"
  sol:
    model: "gpt-5.6-sol"
    explicit_only: true
    output_contract: "trigger; why Luna is insufficient; bounded Sol scope; continuation on Luna; FORK/BLOCKED/UNVERIFIED status"

context:
  fast:  200000
  mid:   200000
  heavy: 200000

capabilities:
  reasoning: true
  tool_use: true
  vision: true
