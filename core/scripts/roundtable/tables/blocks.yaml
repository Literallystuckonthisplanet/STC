# План работ данными (§11 канона), версия формы 2.
#
# Версия 2 сделала машинным то, что в версии 1 лежало прозой в строках:
# область чтения и записи, внешние действия, критерии приёмки с ID, полномочия,
# шлюзы и поглощение блоков. Причина ровно та же, по которой правила уехали из
# документа в таблицы: шесть кругов ревью по прозе плана нашли шесть классов
# противоречий, которые тест ловит бесплатно.
#
# `объявленное_количество` — про класс дефектов «сказано шесть, лежит четыре».
# Тест сверяет число с длиной соответствующего списка в словаре.

версия_контракта: 2

порядок:
  - Б0а
  - Б3а
  - Ш1
  - БТ
  - БК
  - Б1
  - Б2
  - БТ2
  - БИ
  - Б15
  - Б4
  - Б3б
  - Б5
  - Б6
  - Б7
  - Б8
  - Б9
  - Б10
  - Б0б
  - Б11
  - Б12
  - Б13

вне_порядка:
  Б14: "стадия ревью, вне MVP"
  Б16: "локальная модель, вне MVP; после Б15 и Б10"

блоки:
  Б0а:
    что: "документ и существующие файлы в git"
    зависит: []
    состояние: сделано
    читает: []
    пишет: [docs/, deploy/tests/fixtures/roundtable/]
    внешние_действия: []
    приёмка:
      - id: Б0а-1
        условие: "оба в коммите, редакция в индексе совпадает с редакцией в дереве"

  Б3а:
    что: "сборщик финальных команд критиков, без запуска"
    зависит: []
    состояние: сделано
    читает: []
    пишет: [core/scripts/roundtable/adapters.py]
    внешние_действия: []
    приёмка:
      - id: Б3а-1
        условие: "команды собираются для обоих вендоров"
      - id: Б3а-2
        условие: "каждый обязательный флаг проверен позиционно, каждый запрещённый — отрицательным ассертом"
      - id: Б3а-3
        условие: "окружение собирается белым списком; материала в argv нет"

  Ш1:
    что: "шип изоляции с живыми пробоями"
    зависит: [Б3а]
    состояние: сделано
    читает: [core/scripts/roundtable/adapters.py]
    пишет: [deploy/tests/isolation_probe.py, deploy/tests/fixtures/roundtable/isolation-report.json]
    внешние_действия: [вызов_модели, запуск_процесса]
    приёмка:
      - id: Ш1-1
        условие: "положительный и отрицательный контроль пройдены у обоих вендоров по всем четырём пробоям"
      - id: Ш1-2
        условие: "отчёт в репозитории"
      - id: Ш1-3
        условие: "отпечаток изоляции записан и совпадает с текущей средой"

  БТ:
    что: "исполнимый контракт таблиц: строгий загрузчик, типизация, вычислитель, генерация разделов документа"
    зависит: []
    состояние: сделано
    объявленное_количество: {таблицы: 8}
    читает: [core/scripts/roundtable/tables/]
    пишет: [core/scripts/roundtable/tables.py, deploy/tests/test_roundtable_decide.py]
    внешние_действия: []
    приёмка:
      - id: БТ-1
        условие: "один строгий загрузчик используют и тесты, и движок"
      - id: БТ-2
        условие: "дубликаты ключей, неизвестные поля и чужая версия контракта отвергаются"
      - id: БТ-3
        условие: "условия, действия и отказы — закрытые коды, не русские предложения"
      - id: БТ-4
        условие: "для каждой пары (состояние, операция) при любых значениях условий — ровно один исход"
      - id: БТ-5
        условие: "из каждого рабочего состояния есть продолжение, не только отмена"
      - id: БТ-6
        условие: "изменение временной копии YAML меняет поведение движка без правки Python"
      - id: БТ-7
        условие: "нормативные таблицы документа генерируются из YAML, а не пишутся руками"
      - id: БТ-8
        условие: "мутации не выживают: удаление строки, добавление дубля, подмена цели, перестановка вердикта"

  БК:
    что: "канон в машинной форме: структура блоков, полномочия, шлюзы, производная шапка"
    зависит: [БТ]
    состояние: переоткрыт
    переоткрыт_из_за: "ревью #20: отпечаток объёма не замечал перестановки блоков и ослабления шлюза; квитанция памяти принимала любой старый коммит; authority печатал отказ и возвращал успех"
    читает: [.claude/plans/]
    пишет:
      - core/scripts/roundtable/tables/blocks.yaml
      - core/scripts/roundtable/tables/vocabulary.yaml
      - core/scripts/roundtable/tables.py
      - deploy/tests/test_roundtable_tables.py
      - deploy/tests/fixtures/roundtable/approved-plan-2026-08-12.md
      - docs/roundtable.md
      - ~/Work/memory/project_roundtable.md
      - ~/Work/memory/MEMORY.md
    внешние_действия: []
    приёмка:
      - id: БК-1
        условие: "версия контракта — картой по таблицам; таблица чужой версии отвергается"
      - id: БК-2
        условие: "читает, пишет, внешние_действия и приёмка — структурами; дубли ID приёмки отвергнуты"
      - id: БК-3
        условие: "полномочия разделены на заключения_ревью и разрешения_исполнения; запись без разрешимого основания отвергнута"
      - id: БК-4
        условие: "scope_sha256 — карта block_id → хеш, считается по полной записи блока включая текст критериев"
      - id: БК-5
        условие: "правка текста критерия под прежним ID меняет scope_sha256"
      - id: БК-6
        условие: "шлюз проверен с обеих сторон: блок из блокирует не закрывается, блок из до_закрытия закрывается"
      - id: БК-7
        условие: "поглощение проверено тремя формулами, отсутствием обратного ребра и отсутствием цикла"
      - id: БК-8
        условие: "шапка документа генерируется, печатает все причины удержания и ветку MVP завершён"
      - id: БК-9
        условие: "память обновляется вторым шагом и называет ТЕКУЩИЙ коммит канона, а не любой исторический"
      - id: БК-10
        условие: "отпечаток объёма ловит перенос блока в порядке и подмену предусловия шлюза"
      - id: БК-11
        условие: "команда, напечатавшая отказ, возвращает ненулевой код; изоляция — отдельная команда, чтобы не блокировать офлайн-работу"
      - id: БК-12
        условие: "порядок критики записан таблицей, включая правило «мёртвый мутант не считается, пока неизвестно, от чего он умер»"
      - id: БК-13
        условие: "реестр находок ревью: у каждой находки статус, у устранённой — существующий тест, у назначенной — существующий критерий, у избыточной и открытой — обоснование"
      - id: БК-14
        условие: "реестр проверяет содержание, а не форму: текст находки под замком, назначение только незакрытому блоку, у устранённой — исполнимая поломка либо объяснение, почему её нет"
      - id: БК-15
        условие: "список поломок исполним тестом с положительным контролем: до мутации назначенный сторож проходит, после — падает именно он и по своей причине"
      - id: БК-17
        условие: "артефакт-основание разрешения лежит В РЕПОЗИТОРИИ и резолвится от его корня: путь вне репозитория может исчезнуть, и 16.09 он исчез"
      - id: БК-16
        условие: "связь «находка ↔ поломка ↔ сторож» закреплена отпечатком целиком: подменить поломку на чужую существующую и вернуть ложную «устранена» нельзя; у каждого опыта ожидаемая причина обязательна"

  Б1:
    что: "состояние прогона, журнал, блокировки, назначение карточек идеи"
    зависит: [БК]
    состояние: переоткрыт
    переоткрыт_из_за: "ревью #12: обрыв журнала хоронит прогон; ключ повтора глотает второе решение"
    читает: [core/scripts/roundtable/tables/]
    пишет: [core/scripts/roundtable/state.py, deploy/tests/test_roundtable_state.py]
    внешние_действия: []
    приёмка:
      - id: Б1-1
        условие: "цепочка «обрыв → новая операция → холодная загрузка» проходит, прогон остаётся читаемым"
      - id: Б1-2
        условие: "второе отличающееся решение под тем же ключом даёт КОНФЛИКТ_ВХОДА; хеш считается по операции, условиям, виду и ID цели и телу"
      - id: Б1-3
        условие: "после revoke-operation новое решение применяется и видно в истории"
      - id: Б1-4
        условие: "полный повтор идемпотентен и не тратит круг"
      - id: Б1-5
        условие: "submit-decision и submit-framing-decision без цели — отказ"
      - id: Б1-6
        условие: "изменяющий RunStore получить вне open_run нельзя"
      - id: Б1-7
        условие: "kill -9 в середине записи не теряет прогон; повреждённый хвост обрезается под той же блокировкой"
      - id: Б1-8
        условие: "запись idea_candidates_assigned несёт источник, перестановку и встроенные канонические байты карточек"
      - id: Б1-9
        условие: "после падения и холодной загрузки карточки, их ID и порядок восстанавливаются побайтово теми же"
      - id: Б1-10
        условие: "повторное назначение другого набора отвергнуто; источник карточки в обезличенную проекцию не попадает"

  Б2:
    что: "пакет, манифест, канонизация, слепая проекция"
    зависит: [Б1]
    состояние: переоткрыт
    переоткрыт_из_за: "ревью #12: пакет не содержит текста файлов и читает файл дважды; слепой пакет собирается неполным"
    читает: [core/scripts/roundtable/tables/, core/scripts/roundtable/state.py]
    пишет: [core/scripts/roundtable/context.py, deploy/tests/test_roundtable_context.py]
    внешние_действия: []
    приёмка:
      - id: Б2-1
        условие: "файл читается один раз; из этих байтов сразу и хеш, и содержимое пакета"
      - id: Б2-2
        условие: "уникальный маркер из объявленного файла присутствует в material()"
      - id: Б2-3
        условие: "подмена файла между чтениями невозможна; счётчик чтений даёт ровно 1"
      - id: Б2-4
        условие: "слепой пакет — точное равенство перечню слепой_вопрос.показываем; неполный слепой пакет отказ"
      - id: Б2-5
        условие: "слепой режим не принимает файлы артефакта вообще; маркер авторского решения отсутствует в слепом stdin"
      - id: Б2-6
        условие: "пакет воспроизводим байт в байт; симлинк, родительский переход и превышение размера отвергнуты"

  БТ2:
    что: "доисполнение таблиц: закрытые коды для issue и возражений, пятый вход, честный храповик мутаций"
    зависит: [БТ]
    читает: [core/scripts/roundtable/tables/]
    пишет:
      - core/scripts/roundtable/tables/issues.yaml
      - core/scripts/roundtable/tables/framing.yaml
      - core/scripts/roundtable/tables.py
      - deploy/tests/test_roundtable_decide.py
      - deploy/tests/mutate_roundtable_tables.py
    внешние_действия: []
    приёмка:
      - id: БТ2-1
        условие: "ни одного поля условие со свободным текстом в исполняемых правилах"
      - id: БТ2-2
        условие: "пять входов различают отказ пользователя и поломку движка, на каждый — тест"
      - id: БТ2-3
        условие: "переход возражения через decide_issue_transition отвергнут отдельным тестом"
      - id: БТ2-4
        условие: "load() сам зовёт check(); опечатка во временной копии валит загрузку, а не тихо выключает переход"
      - id: БТ2-5
        условие: "строгая проверка вложенных структур: выдуманное вложенное поле отвергнуто"
      - id: БТ2-6
        условие: "храповик работает на временной копии; тест доказывает загрузку мутанта из временного каталога"
      - id: БТ2-7
        условие: "храповик запускает таблицы, decide и тесты стадии идеи"
      - id: БТ2-8
        условие: "четыре класса мутаций по 100 % с раздельными знаменателями по таблице, полю и классу"
      - id: БТ2-9
        условие: "допустимая подмена значения, изменившая исход, поймана эталоном поведения, а не загрузчиком"

  БИ:
    что: "исполнимый контракт стадии «идея»: две схемы, попарная матрица механизмов, фазы, исходы"
    зависит: [Б2, БТ2]
    объявленное_количество: {исходы_идеи: 9}
    читает: [core/scripts/roundtable/state.py, core/scripts/roundtable/tables/]
    пишет:
      - core/scripts/roundtable/tables/stages.yaml
      - core/scripts/roundtable/contracts.py
      - core/scripts/roundtable/schemas/
      - core/scripts/roundtable/context.py
      - deploy/tests/fixtures/roundtable/idea/
    внешние_действия: []
    приёмка:
      - id: БИ-1
        условие: "две схемы idea_proposal и idea_comparison; общий механизм проверки по схеме живёт в contracts.py"
      - id: БИ-2
        условие: "попарная матрица механизмов ровно из трёх неупорядоченных пар; лишняя, недостающая или повторённая пара отвергнута"
      - id: БИ-3
        условие: "источник кандидата модели не передаётся; движок достаёт пару автор↔выбранный внутренне"
      - id: БИ-4
        условие: "таблица истинности годности взаимоисключающа: pass/pass, fail/fail, всё остальное unknown"
      - id: БИ-5
        условие: "двусторонний инвариант выбора: выбран только собственно пройденный кандидат, sentinel тогда и только тогда, когда пройденных нет"
      - id: БИ-6
        условие: "фаза 0 проверяет авторскую карточку до единого платного вызова"
      - id: БИ-7
        условие: "меньше двух валидных предложений — НЕПОЛНЫЙ_ПРОГОН, набор не создан, второй проход не запущен"
      - id: БИ-8
        условие: "повтор ID внутри созданного движком набора — ContractError, а не отказ участника"
      - id: БИ-9
        условие: "девять исходов взаимоисключающи и покрывают все комбинации; на каждый фикстура"
      - id: БИ-10
        условие: "бюджет повтора невалидного ответа закрыт таблицей; фикстура «оба сравнения невалидны» проходит"
      - id: БИ-11
        условие: "второй пакет после падения и resume собирается побайтово тем же"
      - id: БИ-13
        условие: "переход к архитектуре только по явному ОК Антона: стадия крутит уточнения и коррекции решения, пока он не сказал «да»; молчаливый переход запрещён даже при полном согласии критиков"
      - id: БИ-12
        условие: "недоверенный текст кандидата идёт отдельным ограниченным блоком данных"

  Б15:
    что: "программная предпроверка"
    зависит: [Б2]
    объявленное_количество: {коды_предпроверки: 5}
    читает: [core/scripts/roundtable/context.py]
    пишет: [core/scripts/roundtable/precheck.py, core/scripts/roundtable/schemas/precheck_frontmatter.json]
    внешние_действия: []
    приёмка:
      - id: Б15-1
        условие: "пять кодов §7.3, у каждого своя фикстура и свой тест"
      - id: Б15-2
        условие: "свою схему фронтматтера создаёт и проверяет сам; вход — только фронтматтер"
      - id: Б15-3
        условие: "на чистом документе пусто; planned_output отсутствием не валит"
      - id: Б15-4
        условие: "ноль сетевых и модельных вызовов"

  Б4:
    что: "схемы и валидация"
    зависит: [БТ, БИ]
    объявленное_количество: {схемы_контрактов: 9}
    читает: [core/scripts/roundtable/tables/]
    пишет: [core/scripts/roundtable/contracts.py, core/scripts/roundtable/schemas/]
    внешние_действия: []
    приёмка:
      - id: Б4-1
        условие: "девять схем контрактов; схема Б15 остаётся зелёной"
      - id: Б4-2
        условие: "каждый вид порчи отвергнут; поле вердикта отвергнуто"
      - id: Б4-3
        условие: "каждая проверка §6.11 покрыта отдельным тестом"

  Б3б:
    что: "запуск, таймауты, читатели ответов"
    зависит: [Ш1, Б2]
    читает: [core/scripts/roundtable/context.py]
    пишет: [core/scripts/roundtable/adapters.py]
    внешние_действия: [вызов_модели, запуск_процесса]
    приёмка:
      - id: Б3б-1
        условие: "конверт Claude разобран"
      - id: Б3б-2
        условие: "изменение команды из Б3а без повторного Ш1 запрещено"

  Б5:
    что: "реестры и проекции"
    зависит: [Б4]
    читает: [core/scripts/roundtable/tables/]
    пишет: [core/scripts/roundtable/registry.py]
    внешние_действия: []
    приёмка:
      - id: Б5-1
        условие: "переход вне таблицы issue отвергнут; проекция проверена по всему заданию"
      - id: Б5-2
        условие: "реестр возражений к постановке отдельный и переживает завершён"
      - id: Б5-3
        условие: "реестры решений, областей и доказательств собираются в пакет"

  Б6:
    что: "вердикт, круги, контракт E"
    зависит: [Б5]
    читает: [core/scripts/roundtable/registry.py]
    пишет: [core/scripts/roundtable/decision.py]
    внешние_действия: []
    приёмка:
      - id: Б6-1
        условие: "таблица вердикта и обе таблицы событий покрыты построчно"
      - id: Б6-2
        условие: "пять исходов E ограничены таблицей допустимых по типу issue"
      - id: Б6-3
        условие: "вторая сменить_решение принимается и даёт остановлено_для_перепроектирования"
      - id: Б6-4
