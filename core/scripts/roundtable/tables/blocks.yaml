# План работ данными (§11 канона).
#
# Здесь он записан таблицей ровно потому, что дважды разъезжался в прозе:
# у блока стояла зависимость от того, что идёт позже, и объяснение «ничего
# не ждёт» рядом. Тест теперь валит такую пару сразу.
#
# `объявленное_количество` — про класс дефектов «сказано шесть, лежит четыре».
# Тест сверяет число с длиной соответствующего списка в словаре.

версия_контракта: 1

порядок:
  - Б0а
  - Б3а
  - Ш1
  - БТ
  - Б1
  - Б2
  - Б15
  - Б4
  - Б3б
  - Б5
  - Б6
  - Б7
  - Б8
  - Б9
  - Б10
  - Б0б
  - Б11
  - Б12
  - Б13

вне_порядка:
  Б14: "стадия ревью, вне MVP"
  Б16: "локальная модель, вне MVP; после Б15 и Б10"

# `файлы` и `приёмка` переехали сюда из прозы §11 вместе с блоком БТ: раздел
# документа теперь генерируется отсюда, а не пишется руками во второй раз.
блоки:
  Б0а:
    что: "документ и существующие файлы в git"
    зависит: []
    состояние: сделано
    файлы: "`docs/`, `deploy/tests/fixtures/roundtable/`"
    приёмка: "оба в коммите, редакция в индексе совпадает с редакцией в дереве"
  Б3а:
    что: "сборщик финальных команд, без запуска"
    зависит: []
    состояние: сделано
    файлы: "`core/scripts/roundtable/adapters.py` (только сборка)"
    приёмка: "команды собираются для обоих вендоров; каждый обязательный флаг проверен позиционно, каждый запрещённый — отрицательным ассертом; окружение белым списком; материала в argv нет"
  Ш1:
    что: "шип изоляции с живыми пробоями"
    зависит: [Б3а]
    состояние: неполный
    файлы: "`deploy/tests/isolation_probe.py`, отчёт в `deploy/tests/fixtures/roundtable/`"
    приёмка: "положительный и отрицательный контроль пройдены у обоих вендоров по всем четырём пробоям; отчёт в репозитории; команда помечена замороженной"
    блокер: "у Codex на машине не работает роутер инструментов — нет `~/.local/bin/codex-code-mode-host`, любой вызов инструмента падает закрыто и с нашими флагами, и без них. Положительный контроль недостижим, а «не прочитал» без него ничего не доказывает (§5.3)"
  # Ревью #11: YAML сам по себе не делает прозу исполнимой. Нужен блок, после
  # которого таблицы читает не только тест, но и движок — иначе смысл русских
  # условий придётся продублировать в Python и снова получатся два источника.
  БТ:
    что: "исполнимый контракт таблиц: строгий загрузчик, типизация, вычислитель, генерация разделов документа"
    зависит: []
    состояние: сделано
    объявленное_количество: {таблицы: 7}
    файлы: "`core/scripts/roundtable/tables.py`, `deploy/tests/test_roundtable_decide.py`"
    приёмка: "восемь пунктов `приёмка_БТ` ниже"
  Б1:
    что: "состояние прогона, журнал, блокировки"
    зависит: [Ш1, БТ]
    файлы: "`state.py`"
    приёмка: "`resume` переживает `kill -9` и перезагрузку; параллельный вызов отвергнут"
  Б2:
    что: "пакет, манифест, канонизация"
    зависит: [Б1]
    файлы: "`context.py`"
    приёмка: "хеши двух сборок совпадают; симлинк, `../` и превышение размера отвергнуты"
  Б15:
    что: "программная предпроверка"
    зависит: [Б2]
    объявленное_количество: {коды_предпроверки: 5}
    файлы: "`precheck.py`, `schemas/precheck_frontmatter.json`"
    приёмка: "пять кодов §7.3, у каждого своя фикстура и свой тест; свою схему фронтматтера создаёт и проверяет сам; вход — только фронтматтер; на чистом документе пусто; `planned_output` отсутствием не валит; ноль сетевых и модельных вызовов"
  Б4:
    что: "схемы и валидация"
    зависит: [БТ]
    объявленное_количество: {схемы_контрактов: 7}
    файлы: "`contracts.py`, `schemas/`"
    приёмка: "семь схем контрактов; схема Б15 остаётся зелёной; каждый вид порчи отвергнут; поле вердикта отвергнуто; каждая проверка §6.11 покрыта отдельным тестом"
  Б3б:
    что: "запуск, таймауты, читатели ответов"
    зависит: [Ш1, Б2]
    файлы: "`core/scripts/roundtable/adapters.py` (запуск)"
    приёмка: "конверт Claude разобран; изменение команды из Б3а без повторного Ш1 запрещено"
  Б5:
    что: "реестры и проекции"
    зависит: [Б4]
    файлы: "`registry.py`"
    приёмка: "переход вне таблицы issue отвергнут; проекция проверена по всему заданию; реестр возражений к постановке отдельный и переживает `завершён`; реестры решений, областей и доказательств собираются в пакет"
  Б6:
    что: "вердикт, круги, контракт E"
    зависит: [Б5]
    файлы: "`decision.py`"
    приёмка: "таблица вердикта и обе таблицы событий покрыты построчно; пять исходов E ограничены таблицей допустимых по типу issue; вторая `сменить_решение` принимается и даёт `остановлено_для_перепроектирования`; бюджет при перезапуске не обнуляется; поведение при решении во время идущего круга — по `run.yaml`"
  Б7:
    что: "устойчивость, отказы, группы процессов"
    зависит: [Б1, Б3б]
    файлы: "`state.py`, `adapters.py`"
    приёмка: "каждый отказ даёт именно `НЕПОЛНЫЙ_ПРОГОН`; группа процессов убита"
  Б8:
    что: "операции"
    зависит: [Б6, Б7, Б15]
    объявленное_количество: {операции: 11}
    файлы: "`cli.py`, `__main__.py`"
    приёмка: "одиннадцать операций; сценарий «два issue и два возражения решены в одном круге» проходит без `КОНФЛИКТ_ВХОДА`; `submit-framing-decision` работает на завершённом прогоне; `cancel-run` и `revoke-operation` различимы; `precheck` и `publish-check` бюджет не тратят и блокировку не берут"
  Б9:
    что: "публикация протокола"
    зависит: [Б5, Б6]
    файлы: "`protocol.py`"
    приёмка: "запись вне allowlist валит прогон"
  Б10:
    что: "секретарь"
    зависит: [Б6]
    файлы: "`protocol.py`"
    приёмка: "резюме с ID или статусом, которых нет в реестре, отвергается; при отказе модели протокол публикуется без резюме"
  Б0б:
    что: "три недостающие эталонные фикстуры"
    зависит: []
    объявленное_количество: {фикстуры_репетиции: 4}
    файлы: "`deploy/tests/fixtures/roundtable/`"
    приёмка: "`tune-gold.json`, `holdout-plan.md`, `holdout-gold.json` в коммите, итого четыре файла; готовы до прогона Б11"
  Б11:
    что: "стадия план + репетиция"
    зависит: [Б8, Б9, Б10, Б0б]
    файлы: "`prompts/plan_critic.md`"
    приёмка: "по §12 «Репетиция»"
  Б12:
    что: "стадия идея"
    зависит: [Б11]
    файлы: "`prompts/idea_critic.md`"
    приёмка: "обе стадии работают; в задании «идея» есть пункт buy-vs-build"
  Б13:
    что: "раскладка и деплой"
    зависит: [Б12]
    файлы: "`core/commands/roundtable.md`, адаптеры"
    приёмка: "§13 пройден; Codex получил навык"
  Б14:
    что: "стадия ревью реализации"
    зависит: []
    вне_MVP: true
    файлы: "—"
    приёмка: "вне MVP"
  Б16:
    что: "локальная модель на разметке"
    зависит: [Б15, Б10]
    вне_MVP: true
    файлы: "`precheck.py`, `protocol.py`"
    приёмка: "вне MVP. Только фоном; при недоступности ollama прогон идёт без неё; генерации текста нет — только выбор из существующих ID"

# Приёмка БТ — критерии ревью #11, каждый проверяем.
приёмка_БТ:
  - "один строгий загрузчик используют и тесты, и движок"
  - "дубликаты ключей, неизвестные поля и чужая версия контракта отвергаются"
  - "условия, действия и отказы — закрытые коды, не русские предложения"
  - "для каждой пары (состояние, операция) при любых значениях условий — ровно один исход: переход или код отказа"
  - "из каждого рабочего состояния есть продолжение, не только отмена"
  - "изменение временной копии YAML меняет поведение движка без правки Python"
  - "нормативные таблицы документа генерируются из YAML, а не пишутся руками"
  - "мутации не выживают: удаление строки, добавление дубля, подмена цели, перестановка вердикта"

# Списки, длину которых сверяет тест с `объявленное_количество`.
списки:
  таблицы: [vocabulary, run, issues, framing, precheck, blocks, stages]
  фикстуры_репетиции: [tune-plan.md, tune-gold.json, holdout-plan.md, holdout-gold.json]

# Блоки, делящие файлы с соседями: при делегировании идут строго последовательно.
последовательные_из_за_общих_файлов:
  - [Б7, Б1, Б3б]
  - [Б10, Б9]
  - [Б16, Б15, Б10]

# Заморозка команды критика. Плановое правило: после успешного Ш1 команда
# заморожена, и любое её изменение требует повторного прогона Ш1. Пока Ш1 не
# закрыт, замораживать нечего — и записать «заморожена» было бы той самой
# непроверенной гарантией, на которой этот проект уже трижды обжигался.
заморозка_команды:
  заморожена: false
  почему: "Ш1 неполон: у Codex недостижим положительный контроль, см. блокер Ш1"
  отчёт: deploy/tests/fixtures/roundtable/isolation-report.json

# Что можно брать в работу БЕЗ нового круга ревью и без единого вызова критиков.
# Б3а и Ш1 разрешило ревью #11 прямым текстом; БТ им же и предписан — его
# приёмка целиком списана с их требований, значит согласовывать нечего.
разрешено_начинать_сейчас: [Ш1]
вызовов_критиков_требуют: []
