# `алгоритм_отпечатка` в записи — чтобы сдвинувшийся хеш был объясним: scope/2
# добавил точное МЕСТО блока в порядке и полное исполняемое содержимое каждого
# шлюза, который его касается. Раньше и то и другое можно было изменить, не
# потревожив отпечаток: перенести БТ2 перед Б1 или подменить Ш1 на уже закрытый
# блок внутри `до_закрытия` — разрешение оставалось действующим.
#
# 🚩 ДЕЙСТВУЮЩИЕ разрешения. `scope_sha256` обязателен и обязан совпадать с
# отпечатком ТЕКУЩЕГО объёма блока. Отсутствие хеша раньше работало как
# «разрешено всё»: `recorded is None` пропускал любой блок, и разрешение снова
# становилось разрешением по имени — тот самый дефект, ради которого реестр и
# заводился.
