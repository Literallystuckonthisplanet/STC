# --- согласия ----------------------------------------------------------------
# 🚩 Ревью #25: «ОК» существовал сам по себе. Антон принял архитектуру v1, пришла
# поправка, появилась v2 — а запись «принял» осталась, и передачу ничто не
# останавливало. Согласие обязано быть привязано к РЕДАКЦИИ, иначе оно разрешает
# то, чего человек не видел.
согласия:
  правило: "согласие называет этап, артефакт и хеш его редакции; на другую редакцию оно не распространяется"
  сколько: 2
  почему_два: "решение Антона 16.09: два этапа — два ОК. Архитектура и план реализации рассматриваются ОДНИМ комплектом (БА-7), поэтому третьего согласования не возникает: передача только проверяет и отдаёт принятую редакцию"
  цепочка:
    - этап: решение
      принимается: карточка_решения
      разрешает: работу_над_комплектом
    - этап: комплект
      принимается: архитектура_и_план_реализации_вместе
      разрешает: передачу
      аннулируется_при_правке: решения
  передача: "отдельного согласия не требует: отдаётся ровно принятая редакция комплекта, и правка любой её части отзывает разрешение на передачу"
  история: "прежние согласия сохраняются, но работу с новым содержимым не разрешают"
  обязательный_сценарий: "ОК → правка → попытка перейти дальше = отказ, в том числе после перезапуска"

# --- шлюзы --------------------------------------------------------------------
# Организационный запрет пишется ОТДЕЛЬНЫМ полем, а не подделкой под техническую
# зависимость: Б15 от БИ действительно не зависит.
#
# Инвариант: ни один блок из `блокирует` не получает состояние `неполный` или
# `сделано`, пока хоть один блок из `до_закрытия` не закрыт.

шлюзы:
  ремонт_после_ревью_12:
    блокирует: [Б15, Б4, Б3б, Б5, Б6, Б7, Б8, Б9, Б10, Б0б, Б11, Б12, Б13]
    до_закрытия: [БК, Б1, Б2, БТ2, БИ]
    почему: "ревью #12 переоткрыло Б1 и Б2; идти дальше по сломанному основанию дороже, чем починить"
  изоляция_подтверждена:
    блокирует: [Б3б, БА, Б10, Б11, Б12]
    до_закрытия: [Ш1, Ш2]
    почему: "доказательство изоляции — функция версий CLI и отпечатка команды, а не бессрочное свойство проекта"

# --- отпечаток изоляции -------------------------------------------------------
# 🚩 Прежнее поле `заморозка_команды` смотрело только на строки версий. Поменяй
# adapters.py, не трогая версий CLI, — и шлюз остался бы зелёным на
# доказательстве, к новой команде отношения не имеющем.

отпечаток_изоляции:
  проверяет_блок: Ш1
  # Кто умеет звать вендоров. Блок, объявивший `вызов_модели`, обязан зависеть
  # от него: без запуска вызывать нечем, а зависимость «по смыслу» механизм не
  # видит — ревью #26 сняло ребро БА→Б3б, и всё осталось зелёным.
  блок_запуска: Б3б
  # Успешный отчёт — не любой отчёт. Ревью #27: FAIL, INCOMPLETE и снятая
  # заморозка проходили, потому что сравнивались только хеши файлов.
  успешный_вердикт: PASS
  # Чем спрашивать среду о версиях. Спрашивается ВСЕГДА: обновление CLI без
  # правки исходников — обычный день, и прежде оно проходило молча.
  версии_команд:
    claude: [claude, --version]
    codex: [codex, --version]
  отчёт: deploy/tests/fixtures/roundtable/isolation-report.json
  # Каждое поле — файл, чей хеш обязан совпасть с записанным в отчёте. Пока в
  # отчёте раздела `отпечаток` нет, расхождение полное, и Ш1 считается
  # НЕзакрытым — это верно и по факту: CLI успели обновиться. Отчёт не
  # правится задним числом: он доказательство, а не таблица.
  # Что СЧИТАЕТСЯ. Ревью #30: запись отсюда можно было удалить, и её просто
  # переставали проверять — защищено было содержимое списка, но не его состав.
  артефакты:
    хеш_adapters_py: core/scripts/roundtable/adapters.py
    хеш_probe: deploy/tests/isolation_probe.py
  # Ядро, которое нельзя выбросить молча ни при какой настройке.
  требуются_всегда: [хеш_adapters_py, хеш_probe]
  входит_в_отпечаток:
    - версии_CLI
    - хеш_adapters_py
    - хеш_probe
    - хеш_нормализованных_argv
    - хеш_нормализованного_env
    - хеш_схемы_ответа
    - конфигурация_CODEX_HOME
  # 🚩 Объявлено семь полей, считается три. Ревью #31: прежние причины звучали
  # как «и так покрыто» — неверно, сборщик принимает HOME, CODEX_HOME и исходное
  # окружение параметрами, их смена хешей файлов не трогает. Поэтому каждое
  # поле здесь — расхождение: пока хоть одно не считается, Ш1 не закрыт и
  # живых вызовов нет. Работа без моделей этим не держится.
  пока_не_вычисляется:
    хеш_нормализованных_argv:
      почему: "argv собирается из параметров вызова; хеш исходника их не видит — нужен хеш итоговой команды"
      закрывает: Ш2-1
    хеш_нормализованного_env:
      почему: "HOME, CODEX_HOME и исходное окружение приходят параметрами; хеш исходника их не видит"
      закрывает: Ш2-2
    хеш_схемы_ответа:
      почему: "схемы ответа появятся с БИ и Б4, хешировать пока нечего"
      закрывает: Ш2-3
    конфигурация_CODEX_HOME:
      почему: "каталог создаётся шипом; отпечаток его содержимого ещё не считается"
      закрывает: Ш2-4
  # Ревью #35: «все поля умеем считать» — не «текущая версия прошла живую
  # проверку». Второе записано явно: `check` верит флагу при планировании,
  # `authority` сверяет его с настоящим отпечатком. Правка любого входа
  # отпечатка отменяет подтверждение — повторный прогон обязан стоять в плане.
  подтверждение_действует: false
  входы:
    - core/scripts/roundtable/adapters.py
    - deploy/tests/isolation_probe.py
    - core/scripts/roundtable/schemas/
  расхождение: закрывает_шлюз

# --- исполнение ----------------------------------------------------------------
# Кто и как исполняет каждый незакрытый блок (пункт 5 PEV). Волна — блоки,
# которые можно вести одновременно: зависимости закрыты в прежних волнах, а
# области записи не пересекаются. И то и другое проверяет контракт, а не глаз:
# две волны с общим файлом — это два исполнителя, правящих одно и то же.
# Разрешение Антона выдаётся на объём каждого блока, а не на волну.
исполнение:
  роли:
    main: "главная сессия: брифы, интеграция, коммиты с трейлером, учёт, отчёт Антону"
    builder: "субагент-исполнитель: код и тесты блока строго в его `пишет`, TDD по критериям; на развилке возвращает FORK, а не решает"
  проверки:
    qa: "независимые тесты граничных случаев, без правки исходников"
    code-reviewer: "ревью фрагмента без контекста проекта"
    security-arch: "аудит границы безопасности"
    codex: "внешний критик ломает блок по методу «ломать таблицу»"
  # Шаги для каждого блока, по порядку. Шаг не пропускается.
  шаги:
    - "main проверяет разрешение на текущий объём блока; нет — стоп, вопрос Антону"
    - "main выдаёт бриф: блок, критерии приёмки, `пишет`, запреты (флаги обхода, push в main, живые вызовы при закрытом шлюзе)"
    - "исполнитель пишет по тесту на критерий, красный → зелёный"
    - "`tables.py scope <блок>` на подготовленном; файл вне `пишет` — назад исполнителю"
    - "проверки из `ревью` блока; находка — назад, повтор"
    - "main коммитит с трейлером «Roundtable-Block: <блок>»"
    - "codex ломает блок; находки — в реестр, закрыть или обосновать"
    - "main записывает коммиты, ставит «сделано»; authority и храповик зелёные"
  # Что уже пройдено: блок и волна, на которой он закрыт. Список растёт, когда
  # блок уходит из `блоки`. По нему видно, при каком допуске блок закрывался —
  # строка будущих работ этого больше не помнит (ревью #37).
  выполнено: {БК: 1, Б1: 2, БТ2: 2, Б2: 3, БИ: 4, Б15: 5, БУ: 5}
  блоки:
    # Б0б удерживается ремонтным шлюзом до БИ (ревью #34): раньше пятой волны не исполним.
    Б0б: {волна: 5, исполнитель: builder, изоляция: worktree, ревью: [codex]}
    Б4: {волна: 6, исполнитель: builder, изоляция: worktree, ревью: [qa, code-reviewer, codex]}
    Ш2: {волна: 7, исполнитель: main, изоляция: worktree, ревью: [qa, security-arch, codex]}
    Б5: {волна: 7, исполнитель: builder, изоляция: worktree, ревью: [qa, code-reviewer, codex]}
    # Повторный Ш1: живой прогон шипа с полным отпечатком. В плане, пока
    # отпечаток неполон, — иначе шлюз изоляции не откроется никогда.
    Ш1: {волна: [8, 11], исполнитель: main, изоляция: worktree, ревью: [security-arch, codex]}
    Б6: {волна: 8, исполнитель: builder, изоляция: worktree, ревью: [qa, code-reviewer, codex]}
    # Б3б и Б7 правят код запуска — вход отпечатка. После них подтверждение
    # отменено, и повторный Ш1 в одиннадцатой волне восстанавливает его до
    # блоков, которые держит шлюз изоляции (ревью #35).
    Б3б: {волна: 9, исполнитель: main, изоляция: worktree, ревью: [qa, security-arch, codex]}
    Б9: {волна: 9, исполнитель: builder, изоляция: worktree, ревью: [qa, security-arch, codex]}
    Б7: {волна: 10, исполнитель: builder, изоляция: worktree, ревью: [qa, code-reviewer, security-arch, codex]}
    БА: {волна: 12, исполнитель: builder, изоляция: worktree, ревью: [qa, code-reviewer, codex]}
    Б8: {волна: 12, исполнитель: builder, изоляция: worktree, ревью: [qa, code-reviewer, codex]}
    Б10: {волна: 12, исполнитель: builder, изоляция: worktree, ревью: [qa, code-reviewer, codex]}
    БП: {волна: 13, исполнитель: builder, изоляция: worktree, ревью: [qa, code-reviewer, codex]}
    Б11: {волна: 14, исполнитель: main, изоляция: основное_дерево, ревью: [codex]}
    Б12: {волна: 15, исполнитель: main, изоляция: основное_дерево, ревью: [security-arch, codex]}
    Б13: {волна: 16, исполнитель: main, изоляция: основное_дерево, ревью: [security-arch, codex]}

# --- сверка записи -------------------------------------------------------------
# 🚩 R19-7: `пишет` описывало намерение, но не ограничивало исполнение. Теперь
# закрытый блок называет свои коммиты, а `authority` сверяет каждый: трейлер
# своего блока, обычный коммит, ни одного файла вне `пишет`. Коммит с трейлером
# блока, не названный в его списке, — работа мимо учёта. Коммит без трейлера
# сверке невидим: это граница, её держит ревью блока, а не программа.
сверка_записи:
  трейлер: Roundtable-Block
  код_движка: core/scripts/roundtable/
  тесты: deploy/tests/test_roundtable_
  # Закрыты до правила, их коммиты не записаны. Восстанавливать их задним
  # числом — подгонка, поэтому они названы поимённо, а список заперт тестом.
  до_правила: [Б0а, Б3а, Ш1, БТ]
  # Пометка этих коммитов отделена от подписи пустой строкой, и git её не
  # разобрал (круг 42, R42-8). Историю не переписывали: работа откачена
  # обратным коммитом и переложена заново с пометкой в одном абзаце с
  # подписью. Каждую запись сверка доказывает по git — порядок, файлы, трейлер.
  откачено_без_трейлера:
    4bc1a66611ae24b04b169a05956abb201ddab9a8:
      откат: 252794e2c9cc8600e95071cf95c6c3c0cf1c2d5a
      заново: 5f3f45476e91d197e5a7327ae7c0dd5a7da2bd38
      почему: "первый коммит доработки блока прогона; пометка текстом тела"
    1064adb99615461c34e275b2a87a2ab27052b678:
      откат: 252794e2c9cc8600e95071cf95c6c3c0cf1c2d5a
      заново: 1720673c65071150c1dca099480b537c26f2de34
      почему: "второй коммит доработки блока прогона; пометка текстом тела"

# Квитанция второго шага БК. Память живёт вне git, поэтому «обновим тем же
# коммитом» невыполнимо — вместо обещания проверяется факт: каждый файл памяти
# называет коммит, который действительно трогал канон.
проверка_памяти:
  файлы:
    - ~/Work/memory/project_roundtable.md
    - ~/Work/memory/MEMORY.md
  канон:
    - docs/roundtable.md
    - core/scripts/roundtable/tables/blocks.yaml
  # 🚩 Ревью #40: хватало дописать текущий хеш в старый текст. Файл, который
  # ведётся записями, обязан иметь запись с датой не раньше даты канона —
  # иначе «память обновлена» держится на одном переписанном хеше.
  ведутся_записями:
    - ~/Work/memory/project_roundtable.md

# --- как проводится критика ------------------------------------------------
# Ревью #13–#18 шли по прозе плана и стоили шести кругов. Ревью #19 нашло шесть
# дыр не чтением, а мутациями. Ревью #20 нашло, что сам храповик мерил ложь.
# Отсюда порядок, и главное в нём — вторая строка: мёртвый мутант ничего не
# значит, пока неизвестно, ОТ ЧЕГО он умер.
порядок_критики:
  правило: "критик ищет отсутствующий инвариант и проверяет его валидной мутацией на временной копии; мутация считается пойманной только при зелёной контрольной базе и падении заранее назначенной проверки по ожидаемой причине — любое иное падение есть дефект храповика, а не пойманная мутация"
  шаги:
    - прогнать_имеющееся: "pytest, check, authority, isolation, храповик"
    - ломать_на_временной_копии: "одна мутация за раз, канон не трогается"
    - отчёт_таблицей: "мутация → выжила ли → каким тестом поймана"
  классы_мутаций:
    - убрать_правило
    - подменить_значение_на_допустимое
    - подменить_текст_сохранив_ID
    - подсунуть_недопустимое
    - соврать_в_ссылке
    - расширить_себе_объём
    - разорвать_доказательство
  чего_не_найдёт: отсутствующее_правило
  # 🚩 Ревью #39: я написал «каждую строку правил кто-то стережёт». Неправда:
  # часть разделов исключена из знаменателя замера. Граница названа здесь, и
  # тест сверяет этот список с настоящими исключениями храповика — молча
  # вывести раздел из-под замера больше нельзя, а отчёт обязан говорить
  # «измеренные строки», а не «все правила».
  # Круг 45: разделов вне замера целиком больше нет — см. храповик.
  вне_замера: {}
  # Круг 42 (БК-20, R42-12): исключения храповика, действующие только для
  # одного класса мутаций. Причина обязана быть здесь, а не только
  # комментарием в коде: сторож сверяет этот список с храповиком в обе стороны.
  вне_замера_по_классам:
    убрать_правило:
      "precheck.yaml:почему": "проза для человека; ни один тест не читает наличие или текст поля"
    подменить_значение_на_допустимое:
      "vocabulary.yaml:коды_условий.run_finished": "run_finished — объявленный, но нигде не читаемый код условия; ни одна комбинация условий по нему не строится"
    подсунуть_недопустимое:
      "blocks.yaml:порядок_критики.почему": "проза для человека; движок и тесты её не разбирают — недопустимой строки у прозы нет"
      "precheck.yaml:классы_файлов": "пинуются только ключи (set(...) ==); описание-строка не читается"
