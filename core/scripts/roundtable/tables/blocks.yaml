# ⚠️ ДВА РАЗНЫХ РЕЕСТРА, И ЭТО НЕ СТИЛЬ. Критик говорит «готово к реализации» —
# это заключение. Антон говорит «делай» — это право исполнять. Шесть кругов
# подряд я склеивал их в слово «разрешение», и каждый раз через склейку
# протекало разрешение, выданное самому себе.
#
# 🚩 Основание обязано быть РАЗРЕШИМЫМ: uuid находится в названной сессии по
# сырому JSONL, либо хеш совпадает с файлом по локатору. Проверка «строка
# непустая» снята — ровно она пропустила цитату, которую я не смог подтвердить.

