# --- правила проверки источников ---------------------------------------------
# Стоило круга: на отфильтрованном поиске я ошибочно объявил несуществующей
# цитату, которая существовала — оболочка system-reminder раздула реплику, и
# фильтр по длине выбросил её молча.

проверки_источников:
  отрицательное_утверждение_о_событии:
    источник: сырой_JSONL
    запрещено: [отфильтрованный_корпус, поиск_с_ограничением_длины]
    почему: "«не нашёл» и «не существует» — разные утверждения; второе требует полного источника"

# Списки, длину которых сверяет тест с `объявленное_количество`.
списки:
  пункты_плана_PEV:
    - результат_границы_и_что_не_меняется
    - затронутые_файлы_и_доказательства
    - критерии_приёмки_и_проверка
    - блоки_и_зависимости
    - делегирование_модель_изоляция
    - неразрешённые_решения_пользователя
  таблицы: [vocabulary, run, issues, framing, precheck, blocks, stages, findings]
  фикстуры_репетиции: [tune-plan.md, tune-gold.json, holdout-plan.md, holdout-gold.json]
  исходы_идеи:
    - возражение_держит_стадию
    - нет_годного_варианта
    - частичная_негодность
    - оба_предпочли_неавторскую_и_назвали_авторскую_непроходной
    - нет_консенсусно_годного
    - подтверждён
    - оба_предпочли_неавторскую
    - расхождение
    - три_подхода_на_столе
