# Возражения к постановке: отдельный реестр, отдельный автомат (§8.1 канона).
#
# Живут ДОЛЬШЕ прогона: решение принимается в любой момент, включая после
# завершения стадии. Поэтому неизменяемая запись прогона не удаляется, пока
# есть открытое возражение или связанный прогон (см. хранение ниже).

версия_контракта: 1

операция: submit-framing-decision
цель: framing_id

переходы:
  - {из: null,     в: открыто,      кто: движок, условие: "принята валидная находка класса возражение_к_постановке"}
  - {из: открыто,  в: подтверждено, кто: Антон,  условие: "решение подтвердить_постановку, в любой момент"}
  - {из: открыто,  в: принято,      кто: Антон,  условие: "решение изменить_цель или сменить_решение, в любой момент"}
  - {из: открыто,  в: остановлено,  кто: Антон,  условие: "решение остановить, в любой момент"}
  - {из: принято,  в: породило_новый_прогон, кто: движок, условие: "создан новый связанный прогон"}

# Влияние на вердикт стадии зависит от стадии. Единственное место, где это
# записано; в таблице вердикта issues.yaml стоит соответствующая строка.
влияние_по_стадиям:
  идея: держит_стадию      # даёт РЕШЕНИЕ_АНТОНА, стадия не закрывается
  план: не_влияет          # висит флагом, разрешается когда угодно
  ревью: не_влияет         # только эскалация, вердикта не касается

флаг_прогона: есть_открытые_возражения_к_постановке
флаг_обязателен_в: [status, протокол, резюме]

# Права критика по стадиям (§6.10 правило 7). Дверь к пересмотру распахнута
# там, где пересмотр дёшев, и сужается по мере роста цены отката.
права_по_стадиям:
  идея:
    постановка: открыта
    смена_решения: открыта
    buy_vs_build: обязательный_пункт_задания
    область_находок: всё
  план:
    постановка: закрыта_без_нового_доказательства
    смена_решения: открыта
    buy_vs_build: "находка «стадию идея прошли формально»"
    область_находок: скоуп_круга
  ревью:
    постановка: закрыта
    смена_решения: только_с_новым_доказательством
    buy_vs_build: нет
    область_находок: только_изменённое

# Критерии негодности РЕШЕНИЯ — про способ реализации.
критерии_решения:
  - {код: оверинжиниринг,   проверка: "есть альтернатива, выполняющая все AC строго меньшим числом движущихся частей; назови альтернативу и AC, который она не тянет"}
  - {код: негарантируемость, проверка: "ключевое обещание не проверяется ни одной называемой командой или тестом"}
  - {код: опора_на_зыбкое,  проверка: "зависимость от alpha/beta/недокументированного интерфейса без запасного пути"}
  - {код: несходимость,     проверка: "движок считает: одна область даёт блокеры два круга подряд, либо закрытие дважды порождало новые"}
  - {код: цена_согласования, проверка: "движок считает: потрачено на согласование больше оценки реализации"}
  - {код: дорогая_ошибка,   проверка: "откат требует миграции данных, смены публичного контракта или согласования со стороной"}

# Критерии негодности ПОСТАНОВКИ — про цель. Отдельный перечень: «решаем не ту
# проблему» не сводится к оверинжинирингу, и заставлять критика притворяться
# значит плодить мусорные находки.
критерии_постановки:
  - {код: не_та_проблема,        проверка: "названы проблема, которую решает артефакт, и проблема пользователя; они разные"}
  - {код: приёмка_не_меряет,     проверка: "приёмка выполнима целиком, а заявленная польза не наступает — предъявить сценарий"}
  - {код: ограничение_неверно,   проверка: "ограничение подано как данность, но проверяемо и не подтверждается"}
  - {код: цель_достигнута_иначе, проверка: "есть работающее решение той же проблемы; для нового названа польза сверх него"}

# Критерии 4 и 5 движок СЧИТАЕТ, но находкой не заводит: иначе он судил бы по
# существу, что ему запрещено. Число едет в пакет следующего круга и в status.
считает_движок_без_права_поднимать: [несходимость, цена_согласования]

ограничитель_смены_решения:
  сколько: 1
  за: стадию
  исход_второй: остановлено_для_перепроектирования
  природа: политика_цикла      # НЕ следствие бюджета: смена возможна в 1-м круге
  почему: "две смены за стадию означают, что задача не понята, и следующий круг это не чинит"

# Хранение. Реестр переживает прогон, значит запись прогона нельзя удалять,
# пока есть открытое возражение или связь.
хранение:
  неизменяемая_запись_прогона:
    поля: [id, стадия, вердикт, хеш_пакета, действительность, возражения, связи]
    срок: "не удаляется, пока есть открытое возражение или связанный прогон"
  полные_материалы:
    поля: [пакет, ответы, журналы]
    срок: "90 дней после публикации"
  незавершённые_и_ждёт_Антона:
    срок: никогда_не_удаляются
