# Обычные issue: переходы и допустимые решения (§6.6, §6.8 канона).
#
# Возражений к постановке здесь НЕТ и быть не должно — у них свой реестр,
# свой автомат и свой набор решений (framing.yaml). Тест это стережёт:
# пересечение наборов решений валит сборку.

версия_контракта: 1

# БТ2 (R21-5 → БТ2-1): закрытые коды-различители ЭТОГО автомата. Не в
# vocabulary.yaml — эти значения не статус, не класс и не решение общего
# канала, а ответ конкретной роли в конкретном переходе. `decision` не
# повторяется здесь: это уже закрытый код vocabulary.решения_по_issue, и
# `decide_issue_transition` (tables.py) читает его прямо оттуда.
коды_условий:
  ответ_ведущего: [принял, оспорил]
  итог_критика: [исправлено, осталось]
  блокер: [сменой_решения, только_сменой_цели, неизвестное_высокой_существенности, правкой_круги_исчерпаны]

# `условие` ниже — проза для человека и для генератора документа; её пинает
# test_every_route_to_anton_exists_from_both_author_statuses и рендер §8. Она
# не исполняется. Исполняет переход `событие` + `условия`/`исходы` — закрытые
# коды выше или уже закрытый `decision`; `decide_issue_transition` (tables.py)
# не читает поле `условие` вовсе.
переходы:
  - {из: null,                 в: [открыт],                                  кто: движок,  условие: "принята валидная находка",
     событие: new-finding, условия: {}}
  - {из: открыт,               в: [принят_автором, оспорен_автором],         кто: ведущий, условие: "контракт C",
     событие: lead-response,
     исходы: [{условия: {ответ_ведущего: принял},  в: принят_автором},
              {условия: {ответ_ведущего: оспорил}, в: оспорен_автором}]}
  - {из: остался,              в: [принят_автором, оспорен_автором],         кто: ведущий, условие: "контракт C",
     событие: lead-response,
     исходы: [{условия: {ответ_ведущего: принял},  в: принят_автором},
              {условия: {ответ_ведущего: оспорил}, в: оспорен_автором}]}
  - {из: принят_автором,       в: [закрыт_исправлением, остался],            кто: поднявший_критик, условие: "контракт D",
     событие: critic-outcome,
     исходы: [{условия: {итог_критика: исправлено}, в: закрыт_исправлением},
              {условия: {итог_критика: осталось},    в: остался}]}
  - {из: оспорен_автором,      в: [возражение_снято, остался],               кто: поднявший_критик, условие: "контракт D",
     событие: critic-outcome,
     исходы: [{условия: {итог_критика: исправлено}, в: возражение_снято},
              {условия: {итог_критика: осталось},    в: остался}]}
  # Ревью #11: маршрут к Антону был объявлен только из ОДНОГО из двух авторских
  # статусов на каждый тип. Новая находка всегда `открыт`, поэтому блокер
  # `только_сменой_цели` застревал: вердикт требовал решения Антона, а перехода
  # к нему не существовало. Теперь каждый тип покрыт из ОБОИХ статусов.
  - {из: открыт,               в: [вынесен_Антону],                          кто: движок,  условие: "блокер сменой_решения, любой круг",
     событие: escalate, условия: {блокер: сменой_решения}}
  - {из: остался,              в: [вынесен_Антону],                          кто: движок,  условие: "блокер сменой_решения, любой круг",
     событие: escalate, условия: {блокер: сменой_решения}}
  - {из: открыт,               в: [вынесен_Антону],                          кто: движок,  условие: "блокер только_сменой_цели, любой круг",
     событие: escalate, условия: {блокер: только_сменой_цели}}
  - {из: остался,              в: [вынесен_Антону],                          кто: движок,  условие: "блокер только_сменой_цели, любой круг",
     событие: escalate, условия: {блокер: только_сменой_цели}}
  - {из: открыт,               в: [вынесен_Антону],                          кто: движок,  условие: "неизвестное высокой существенности, любой круг",
     событие: escalate, условия: {блокер: неизвестное_высокой_существенности}}
  - {из: остался,              в: [вынесен_Антону],                          кто: движок,  условие: "неизвестное высокой существенности, любой круг",
     событие: escalate, условия: {блокер: неизвестное_высокой_существенности}}
  - {из: открыт,               в: [вынесен_Антону],                          кто: движок,  условие: "блокер правкой, круги исчерпаны",
     событие: escalate, условия: {блокер: правкой_круги_исчерпаны}}
  - {из: остался,              в: [вынесен_Антону],                          кто: движок,  условие: "блокер правкой, круги исчерпаны",
     событие: escalate, условия: {блокер: правкой_круги_исчерпаны}}
  # Контракт E: `decision` — тот же закрытый код канала issue из
  # vocabulary.коды_условий, что и submit-decision run-автомата. Реальный
  # вызов передаёт и `блокер` — тип issue, зафиксированный при эскалации; по
  # нему decide_issue_transition сверяет `допустимые_решения` и отвечает
  # отказом РЕШЕНИЕ_ВНЕ_ТИПА, а не молча принимает решение не той формы
  # (БТ2-2, БТ2-3).
  - {из: вынесен_Антону,       в: [риск_принят, остановлено, цель_изменена, решение_изменено, открыт], кто: Антон, условие: "контракт E, в границах допустимых решений",
     событие: anton-decision,
     исходы: [{условия: {decision: принять_риск},         в: риск_принят},
              {условия: {decision: остановить},           в: остановлено},
              {условия: {decision: изменить_цель},        в: цель_изменена},
              {условия: {decision: сменить_решение},      в: решение_изменено},
              {условия: {decision: запросить_ещё_правку}, в: открыт}]}

# Кто вправе довести issue до терминального состояния.
кто_завершает:
  поднявший_критик: [закрыт_исправлением, возражение_снято]
  Антон: [риск_принят, остановлено, цель_изменена, решение_изменено]
  никто_иной: "ни автор, ни секретарь, ни второй критик"

# Допустимые решения по типу issue. Решение вне своей строки — отказ операции.
# Тест: объединение по всем типам == `решения_по_issue` словаря, и ни одно
# значение не приходит из набора решений по возражению.
допустимые_решения:
  блокер_правкой_круги_исчерпаны: [принять_риск, остановить, запросить_ещё_правку]
  блокер_сменой_решения:          [сменить_решение, принять_риск, остановить]
  блокер_только_сменой_цели:      [изменить_цель, принять_риск, остановить]
  неизвестное_высокой_существенности: [принять_риск, запросить_ещё_правку, остановить]

# Таблица вердикта. Проверяется СВЕРХУ ВНИЗ, первое совпадение выигрывает.
# Порядок значим: НЕПОЛНЫЙ_ПРОГОН перекрывает всё.
вердикт:
  - {условие: "обязательный участник не дал валидного ответа", вердикт: НЕПОЛНЫЙ_ПРОГОН}
  - {условие: "активный блокер только_сменой_цели",            вердикт: РЕШЕНИЕ_АНТОНА}
  - {условие: "активный блокер сменой_решения",                вердикт: РЕШЕНИЕ_АНТОНА}
  - {условие: "открытое возражение к постановке на стадии идея", вердикт: РЕШЕНИЕ_АНТОНА}
  - {условие: "активный блокер правкой, круги не исчерпаны",   вердикт: НУЖНЫ_ПРАВКИ}
  - {условие: "активный блокер правкой, круги исчерпаны",      вердикт: РЕШЕНИЕ_АНТОНА}
  - {условие: "активное неизвестное высокой существенности",   вердикт: РЕШЕНИЕ_АНТОНА}
  - {условие: "иначе",                                          вердикт: ОДОБРЕНО}

# СТОП не вычисляется из состава находок — он появляется только как результат
# решения Антона `остановить`. Тест сверяет, что СТОП не встречается в таблице
# вердикта и встречается в событиях run.yaml.
вердикт_вне_таблицы:
  СТОП: "только через решение Антона `остановить` (run.yaml → события_issue)"

обязательства:
  что_входит: "активные неблокирующие находки и неизвестные низкой существенности"
  куда: "в протокол и автору, без нового круга"

# Межполевые запреты валидации (§6.11). Каждый — отдельный тест в Б4.
# Здесь они данными, чтобы список нельзя было расширить в одном месте и забыть
# в другом.
валидация:
  - {правило: "нечего_добавить=да и непустой список находок", исход: отказ}
  - {правило: "нечего_добавить=нет и пустой список находок",  исход: отказ}
  - {правило: "сменой_решения или возражение_к_постановке без критерий/альтернатива/цена_перехода", исход: находка_невалидна}
  - {правило: "сменой_решения или только_сменой_цели при классе не блокирующая", исход: отказ}
  - {правило: "возражение_к_постановке с полем устранимость", исход: отказ}
  - {правило: "критерий не из перечня, положенного этому виду", исход: отказ}
  - {правило: "area_id отсутствует или не найден в реестре областей", исход: отказ}
  - {правило: "evidence пуст, запись не найдена, или тип вне перечня", исход: отказ}
  - {правило: "command_run без кода возврата, версии инструмента или хеша редакции", исход: отказ}
  - {правило: "command_run создан критиком", исход: отказ}
  - {правило: "target_decision_id присутствует, но не найден в реестре решений", исход: отказ}
  - {правило: "target_decision_id отсутствует при сменой_решения, только_сменой_цели или переоткрытии", исход: отказ}
  - {правило: "reopens_issue_id указывает на issue другого критика", исход: отказ}
  - {правило: "переоткрытие, где все отпечатки evidence уже были в прошлой попытке", исход: отказ}
  - {правило: "решение Антона вне списка допустимых для типа issue", исход: отказ}
  - {правило: "поле вердикта в ответе критика", исход: ответ_отвергнут}
  - {правило: "разбиение секретаря: topic_id вне перечня, несуществующий issue_id, пропущенный активный issue или пересечение групп", исход: резюме_отвергнуто}
