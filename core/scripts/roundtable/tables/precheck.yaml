# Программная предпроверка Б15 (§7.3 канона).
#
# Вход — ТОЛЬКО фронтматтер артефакта по схеме precheck_frontmatter.json.
# Свободный текст не разбирается вообще: иначе появляется порог ложных
# срабатываний, назначить который без данных нельзя.
#
# Ноль сетевых и модельных вызовов. Ноль расхода подписки. Именно поэтому
# проверка гоняется сколько угодно раз и до любого круга.

версия_контракта: 1

схема_входа: schemas/precheck_frontmatter.json
зависимость_блока: Б2          # и только Б2: свою схему Б15 несёт сам

коды:
  - код: BROKEN_ANCHOR
    срабатывает: "якорь ref:* не объявлен ни одним разделом"
    фикстура: broken-section-target.md
  - код: MISSING_EXISTING_EVIDENCE
    срабатывает: "файл помечен existing_evidence, но его нет или хеш не сошёлся"
    фикстура: removed-block.md
  - код: DECLARED_COUNT_MISMATCH
    срабатывает: "длина явного списка не равна объявленному числу"
    фикстура: count-mismatch.md
  - код: REVISION_MISMATCH
    срабатывает: "редакция в шапке не равна редакции в манифесте пакета"
    фикстура: revision-mismatch/
  - код: FORBIDDEN_CAPABILITY_PRESENT
    срабатывает: "active_capabilities ∩ forbidden_capabilities не пусто"
    фикстура: forbidden-capability.md

# Что НЕ проверяется — записано явно, чтобы обещание не расползалось.
# Оба случая ниже реальны: они стоили круга ревью каждый, и оба смысловые.
вне_возможностей:
  - "«§13 вместо §15» — оба раздела существуют, структурная проверка молчит"
  - "«возможность исключена, а упоминание осталось» вне закрытых перечней"
почему: "это суждение о смысле; остаётся критикам либо уезжает в Б16 с порогом"

# Файлы манифеста делятся по ожиданию существования. Без этого «объявлено
# четыре файла» конфликтует с «три из них создаются позже».
классы_файлов:
  existing_evidence: "обязан существовать, хеш сверяется"
  planned_output: "создаётся позже, отсутствие — норма"

фикстуры:
  каталог: deploy/tests/fixtures/roundtable/precheck/
  эталон: expected.json
  правило: "по одной фикстуре и одному тесту на код; на чистом документе — пусто"
  не_смешивать_с: "tune/holdout — те проверяют поведение моделей, а не программы"

# Общий резолвер ссылок НЕ переиспользуется: в deploy/checks.py лежит регулярка
# под [[wiki-link]], а Б15 говорит на языке ref:*. Общий модуль имеет смысл
# только после выбора единого синтаксиса — иначе это модуль для двух языков.
общий_резолвер: отложен
