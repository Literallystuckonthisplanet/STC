# Автомат прогона (§8, §8.0 канона) — условиями-кодами, не фразами.
#
# Ревью #11: свободный текст в поле `условие` означал, что программа не может
# его вычислить и смысл придётся продублировать в Python — снова два источника.
# Теперь `условия` — словарь из закрытых кодов (vocabulary.yaml → коды_условий),
# `действия` — коды из коды_действий, отказ — код из коды_отказа.
#
# Инвариант, который стережёт тест: для любой пары (из, событие) никакие два
# перехода не могут совпасть одновременно — их условия обязаны конфликтовать
# хотя бы по одному ключу. Так «два одинаковых по смыслу перехода с разной
# формулировкой» перестают быть возможными в принципе.

версия_контракта: 1

переходы:
  - из: null
    событие: start
    условия: {}
    в: создан

  - из: создан
    событие: пакет_собран
    условия: {}
    в: идёт_круг

  - из: идёт_круг
    событие: вердикт
    условия: {verdict: ОДОБРЕНО}
    в: завершён

  - из: идёт_круг
    событие: вердикт
    условия: {verdict: НУЖНЫ_ПРАВКИ}
    в: ждёт_автора

  - из: идёт_круг
    событие: вердикт
    условия: {verdict: РЕШЕНИЕ_АНТОНА}
    в: ждёт_Антона

  - из: идёт_круг
    событие: вердикт
    условия: {verdict: НЕПОЛНЫЙ_ПРОГОН}
    в: неполный

  - из: ждёт_автора
    событие: submit-revision
    условия: {budget_allows_round: true}
    в: идёт_круг

  - из: ждёт_автора
    событие: submit-revision
    условия: {budget_allows_round: false}
    в: ждёт_Антона

  # Ревью #11: здесь стояло `в: идёт_круг`, а таблица событий говорила
  # `ждёт_автора`. Право второе: решение Антона не содержит новой редакции,
  # запускать критиков не с чем — сначала отвечает автор.
  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: запросить_ещё_правку, budget_fits_quorum: true}
    в: ждёт_автора
    действия: [reopen_issue, record_extra_round]

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: запросить_ещё_правку, budget_fits_quorum: false}
    в: ждёт_Антона
    отказ: БЮДЖЕТ_НЕ_ВМЕЩАЕТ_КВОРУМ

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: сменить_решение, change_index: первая}
    в: ждёт_автора
    действия: [reset_round_counter]

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: сменить_решение, change_index: вторая}
    в: остановлено_для_перепроектирования

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: остановить}
    в: завершён

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: изменить_цель}
    в: завершён
    действия: [mark_run_superseded]

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: принять_риск, all_verdict_blocking_resolved: false}
    в: ждёт_Антона

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: принять_риск, all_verdict_blocking_resolved: true}
    в: завершён
    действия: [recompute_verdict]

  - из: неполный
    событие: resume
    условия: {}
    в: идёт_круг

  - из: создан
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [record_reason]
  - из: идёт_круг
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [kill_process_group, mark_results_stale, record_reason]
  - из: ждёт_автора
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [record_reason]
  - из: ждёт_Антона
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [record_reason]
  - из: неполный
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [record_reason]

  # Решения по возражению к постановке. Ревью #11: из `неполный` перехода не
  # было вовсе — а сценарий живой: один критик успел породить возражение,
  # второй сломался, прогон стал `неполный`, Антон принял возражение.
  - из: создан
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку}
    в: создан
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку, round_running: true}
    в: идёт_круг
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку, round_running: false}
    в: идёт_круг
    действия: [recompute_verdict]
  - из: ждёт_автора
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку}
    в: ждёт_автора
    действия: [recompute_verdict]
  - из: ждёт_Антона
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку}
    в: ждёт_Антона
    действия: [recompute_verdict]
  - из: неполный
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку}
    в: неполный

  - из: создан
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [kill_process_group, mark_results_stale, mark_run_superseded, spawn_linked_run, record_reason]
  - из: ждёт_автора
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: ждёт_Антона
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: неполный
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]

  - из: создан
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [kill_process_group, mark_results_stale, mark_run_superseded, spawn_linked_run, record_reason]
  - из: ждёт_автора
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: ждёт_Антона
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: неполный
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]

  - из: создан
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [mark_run_superseded, record_reason]
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [kill_process_group, mark_results_stale, mark_run_superseded, record_reason]
  - из: ждёт_автора
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [mark_run_superseded, record_reason]
  - из: ждёт_Антона
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [mark_run_superseded, record_reason]
  - из: неполный
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [mark_run_superseded, record_reason]

# Что каждое действие значит. Движок реализует по одной чистой функции на код.
действия:
  reopen_issue: "issue возвращается в `открыт`"
  record_extra_round: "круг сверх потолка пишется в протокол"
  reset_round_counter: "счётчик кругов стадии обнуляется; бюджет НЕ обнуляется"
  kill_process_group: "убивается вся группа процессов критиков, не только родитель"
  mark_results_stale: "частичные ответы помечаются `устарели`; бюджет списан и не возвращается"
  mark_run_superseded: "поле `действительность` := superseded; состояние прогона не меняется"
  spawn_linked_run: "создаётся новый прогон со ссылкой на прежний, ПОСЛЕ применения перехода"
  recompute_verdict: "вердикт пересчитывается по таблице issues.yaml"
  record_reason: "причина операции пишется в историю"

# Границы отзыва операции. Историю не переписываем никогда.
revoke_operation:
  цель: operation_id
  разрешено_если: "после операции нет зависимых событий"
  зависимое_событие: [смена_состояния_прогона, создан_дочерний_прогон, публикация, последующая_операция_на_ней]
  иначе: ЕСТЬ_ЗАВИСИМЫЕ_СОБЫТИЯ
  компенсация: "переиграть можно только новым решением, видимым в истории"
  отката_истории: false
