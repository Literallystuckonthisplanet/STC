# Автомат прогона + стык с решениями (§8, §8.0 канона).
#
# Переход вне этой таблицы — ошибка. Тест проверяет: полноту (у каждого
# рабочего состояния есть выход), терминальность (у терминальных выходов нет),
# достижимость каждого состояния от `создан`, и отсутствие двух разных исходов
# у одной пары (из, событие, условие).

версия_контракта: 1

переходы:
  - {из: null,           в: создан,       событие: start,             условие: "операция start"}
  - {из: создан,         в: идёт_круг,    событие: пакет_собран,      условие: "критики запущены"}
  - {из: идёт_круг,      в: завершён,     событие: вердикт,           условие: "ОДОБРЕНО, в том числе в первом круге"}
  - {из: идёт_круг,      в: ждёт_автора,  событие: вердикт,           условие: "НУЖНЫ_ПРАВКИ, круги не исчерпаны"}
  - {из: идёт_круг,      в: ждёт_Антона,  событие: вердикт,           условие: "РЕШЕНИЕ_АНТОНА, в любом круге"}
  - {из: идёт_круг,      в: неполный,     событие: вердикт,           условие: "НЕПОЛНЫЙ_ПРОГОН"}
  - {из: ждёт_автора,    в: идёт_круг,    событие: submit-revision,   условие: "бюджет позволяет"}
  - {из: ждёт_автора,    в: ждёт_Антона,  событие: бюджет_исчерпан,   условие: "бюджет или круги исчерпаны"}
  - {из: ждёт_Антона,    в: идёт_круг,    событие: запросить_ещё_правку, условие: "бюджет позволяет полный кворум"}
  - {из: ждёт_Антона,    в: ждёт_автора,  событие: сменить_решение,   условие: "первая смена за стадию; счётчик кругов обнуляется, бюджет нет"}
  - {из: ждёт_Антона,    в: остановлено_для_перепроектирования, событие: сменить_решение, условие: "вторая смена за стадию"}
  - {из: ждёт_Антона,    в: завершён,     событие: остановить,        условие: "вердикт стадии СТОП"}
  - {из: ждёт_Антона,    в: завершён,     событие: изменить_цель,     условие: "действительность := superseded"}
  - {из: ждёт_Антона,    в: завершён,     событие: все_разрешены,     условие: "разрешены все вынесен_Антону, влияющие на вердикт"}
  - {из: неполный,       в: идёт_круг,    событие: resume,            условие: "новая попытка, бюджет учтён"}
  - {из: создан,         в: отменён,      событие: cancel-run,        условие: "с причиной"}
  - {из: идёт_круг,      в: отменён,      событие: cancel-run,        условие: "с причиной"}
  - {из: ждёт_автора,    в: отменён,      событие: cancel-run,        условие: "с причиной"}
  - {из: ждёт_Антона,    в: отменён,      событие: cancel-run,        условие: "с причиной"}
  - {из: неполный,       в: отменён,      событие: cancel-run,        условие: "с причиной"}
  - {из: идёт_круг,      в: отменён,      событие: изменить_цель_framing,  условие: "решение по возражению, прогон незавершён"}
  - {из: идёт_круг,      в: отменён,      событие: сменить_решение_framing, условие: "решение по возражению, прогон незавершён"}
  - {из: идёт_круг,      в: отменён,      событие: остановить_framing, условие: "решение по возражению, прогон незавершён"}
  - {из: ждёт_автора,    в: отменён,      событие: изменить_цель_framing,  условие: "решение по возражению, прогон незавершён"}
  - {из: ждёт_автора,    в: отменён,      событие: сменить_решение_framing, условие: "решение по возражению, прогон незавершён"}
  - {из: ждёт_автора,    в: отменён,      событие: остановить_framing, условие: "решение по возражению, прогон незавершён"}
  - {из: ждёт_Антона,    в: отменён,      событие: изменить_цель_framing,  условие: "решение по возражению, прогон незавершён"}
  - {из: ждёт_Антона,    в: отменён,      событие: сменить_решение_framing, условие: "решение по возражению, прогон незавершён"}
  - {из: ждёт_Антона,    в: отменён,      событие: остановить_framing, условие: "решение по возражению, прогон незавершён"}

# Решения по обычному issue: что делается с прогоном и с объектом.
# Тест сверяет, что множество ключей совпадает с `решения_по_issue` словаря.
события_issue:
  принять_риск:
    прогон: остаётся ждёт_Антона; пересчёт вердикта, когда разрешён последний влияющий
    статус_issue: риск_принят
    побочное: "в протокол как принятый риск, не как исправление"
  запросить_ещё_правку:
    прогон: ждёт_автора, если бюджет вмещает полный кворум; иначе остаётся
    статус_issue: открыт
    побочное: "круг сверх потолка, пишется в протокол"
  сменить_решение:
    прогон: "первая за стадию — ждёт_автора; вторая — остановлено_для_перепроектирования"
    статус_issue: решение_изменено
    побочное: "счётчик кругов обнуляется, бюджет не обнуляется"
  остановить:
    прогон: завершён
    статус_issue: остановлено
    побочное: "вердикт стадии СТОП"
  изменить_цель:
    прогон: завершён
    статус_issue: цель_изменена
    побочное: "действительность := superseded; новый прогон автоматически НЕ создаётся"

# Решения по возражению к постановке. Отдельная операция, отдельный набор.
события_возражения:
  подтвердить_постановку:
    прогон_незавершён: "круг идёт — остаётся идёт_круг; круг не идёт — пересчёт вердикта"
    прогон_завершён: без изменений
    статус_возражения: подтверждено
    середина_круга: не_трогать
  изменить_цель:
    прогон_незавершён: отменён
    прогон_завершён: "действительность := superseded"
    статус_возражения: принято
    середина_круга: убить_процессы
  сменить_решение:
    прогон_незавершён: отменён
    прогон_завершён: "действительность := superseded"
    статус_возражения: принято
    середина_круга: убить_процессы
  остановить:
    прогон_незавершён: отменён
    прогон_завершён: "действительность := superseded, новый прогон не создаётся"
    статус_возражения: остановлено
    середина_круга: убить_процессы

# Что значит каждая политика середины круга.
политики_середины_круга:
  не_трогать: "процессы живут, круг доигрывается, вердикт считается штатно"
  убить_процессы: "группа процессов убита, частичные результаты помечены `устарели`, бюджет списан и не возвращается; если работа нужна дальше — прогон в `неполный` и явный `resume`"

# Границы отзыва операции. Истории не переписываем никогда.
revoke_operation:
  цель: operation_id
  разрешено_если: "после операции нет зависимых событий — прогон не сменил состояние, дочерний прогон не создан, публикации не было, следующие операции на неё не опираются"
  иначе: "отказ; переиграть можно только компенсирующей записью"
  отката_истории: false
