# Автомат прогона (§8, §8.0 канона) — условиями-кодами, не фразами.
#
# Ревью #11: свободный текст в поле `условие` означал, что программа не может
# его вычислить и смысл придётся продублировать в Python — снова два источника.
# Теперь `условия` — словарь из закрытых кодов (vocabulary.yaml → коды_условий),
# `действия` — коды из коды_действий, отказ — код из коды_отказа.
#
# Инвариант, который стережёт тест: для любой пары (из, событие) никакие два
# перехода не могут совпасть одновременно — их условия обязаны конфликтовать
# хотя бы по одному ключу. Так «два одинаковых по смыслу перехода с разной
# формулировкой» перестают быть возможными в принципе.

версия_контракта: 1

переходы:
  - из: null
    событие: start
    условия: {}
    в: создан

  - из: создан
    событие: пакет_собран
    условия: {}
    в: идёт_круг

  - из: идёт_круг
    событие: вердикт
    условия: {verdict: ОДОБРЕНО}
    в: завершён

  - из: идёт_круг
    событие: вердикт
    условия: {verdict: НУЖНЫ_ПРАВКИ}
    в: ждёт_автора

  - из: идёт_круг
    событие: вердикт
    условия: {verdict: РЕШЕНИЕ_АНТОНА}
    в: ждёт_Антона

  - из: идёт_круг
    событие: вердикт
    условия: {verdict: НЕПОЛНЫЙ_ПРОГОН}
    в: неполный

  - из: ждёт_автора
    событие: submit-revision
    условия: {budget_allows_round: true}
    в: идёт_круг

  - из: ждёт_автора
    событие: submit-revision
    условия: {budget_allows_round: false}
    в: ждёт_Антона

  # Ревью #11: здесь стояло `в: идёт_круг`, а таблица событий говорила
  # `ждёт_автора`. Право второе: решение Антона не содержит новой редакции,
  # запускать критиков не с чем — сначала отвечает автор.
  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: запросить_ещё_правку, budget_fits_quorum: true}
    в: ждёт_автора
    действия: [reopen_issue, record_extra_round]

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: запросить_ещё_правку, budget_fits_quorum: false}
    в: ждёт_Антона
    отказ: БЮДЖЕТ_НЕ_ВМЕЩАЕТ_КВОРУМ

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: сменить_решение, change_index: первая}
    в: ждёт_автора
    действия: [reset_round_counter]

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: сменить_решение, change_index: вторая}
    в: остановлено_для_перепроектирования

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: остановить}
    в: завершён

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: изменить_цель}
    в: завершён
    действия: [mark_run_superseded]

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: принять_риск, all_verdict_blocking_resolved: false}
    в: ждёт_Антона

  - из: ждёт_Антона
    событие: submit-decision
    условия: {decision: принять_риск, all_verdict_blocking_resolved: true}
    в: завершён
    действия: [recompute_verdict]

  # БУ-13: продолжение неполного прогона. Оба условия считает журнал (RunStore),
  # а не вызывающий: `submit("resume", ...)` с чужими условиями отвергается.
  #   budget_remains    — у каждого критика без валидного ответа остались и повтор,
  #                       и непрерванный вызов (различие «обрыв» / «исчерпание»);
  #   input_can_progress — продолжение что-то изменит: неполный не из-за входа, который
  #                       не собирается (тот же вход соберётся так же), и круг не
  #                       новый без закреплённого входа (это коррекция, часть 2).
  # Отказ — названный исход, прогон остаётся как был. Ключ повтора операции включает
  # позицию журнала (state.OPERATIONS_KEYED_BY_POSITION): та же команда в том же
  # состоянии — повтор, второе продолжение после новых событий — новая операция.
  - из: неполный
    событие: resume
    условия: {budget_remains: true, input_can_progress: true}
    в: идёт_круг

  - из: неполный
    событие: resume
    условия: {budget_remains: false}
    в: неполный
    отказ: ПРОДОЛЖИТЬ_НЕЧЕМ

  - из: неполный
    событие: resume
    условия: {budget_remains: true, input_can_progress: false}
    в: неполный
    отказ: НУЖНА_КОРРЕКЦИЯ_ВХОДА

  # БУ-15: ОК Антона. Запись ОК — событие журнала, состояние не меняет (`ok_binding` считает
  # движок по транскрипту и журналу). После выхода записать новый ОК нельзя: `завершён` —
  # конечное состояние, исходящих переходов у него нет (та же реплика возвращает прежнюю запись). Выход со стадии — `этап_пройден`: только по ОК на текущую
  # редакцию текущего круга и без открытого возражения к постановке.
  - из: ждёт_Антона
    событие: ок_антона
    условия: {ok_binding: true}
    в: ждёт_Антона

  - из: ждёт_Антона
    событие: ок_антона
    условия: {ok_binding: false}
    в: ждёт_Антона
    отказ: ОК_НЕ_ЗАСЧИТАН

  - из: ждёт_Антона
    событие: этап_пройден
    условия: {anton_ok: есть, framing_objection: false}
    в: завершён

  - из: ждёт_Антона
    событие: этап_пройден
    условия: {anton_ok: есть, framing_objection: true}
    в: ждёт_Антона
    отказ: ЕСТЬ_ОТКРЫТОЕ_ВОЗРАЖЕНИЕ

  - из: ждёт_Антона
    событие: этап_пройден
    условия: {anton_ok: нет}
    в: ждёт_Антона
    отказ: НЕТ_ОК_АНТОНА

  - из: ждёт_Антона
    событие: этап_пройден
    условия: {anton_ok: устарел}
    в: ждёт_Антона
    отказ: ОК_УСТАРЕЛ

  # БУ-12: закрепление входа стадии и второго пакета — записи журнала, состояние
  # прогона не меняют (из = в). Что считать повтором, а что конфликтом — в
  # vocabulary.закрепление; правило исполняет RunStore.pin.
  - из: создан
    событие: вход_закреплён
    условия: {}
    в: создан

  - из: идёт_круг
    событие: вход_закреплён
    условия: {}
    в: идёт_круг

  # БУ-1…БУ-8: поправка карточки автора. Один оборот цикла уточнений: показ → поправка → новый круг.
  # `turns_left` считает журнал (число поправок меньше потолка из vocabulary.цикл_уточнений); без
  # оборотов прогон останавливается для перепроектирования, автоматического согласия нет. Из
  # неполного прогона поправка возможна, когда продолжать нечем или вход не ведёт вперёд; если
  # продолжение и так возможно — названный отказ. Прежние оценки помечаются устаревшими.
  - из: ждёт_Антона
    событие: поправка
    условия: {turns_left: true}
    в: идёт_круг
    действия: [mark_results_stale]

  - из: ждёт_Антона
    событие: поправка
    условия: {turns_left: false}
    в: остановлено_для_перепроектирования

  # Из неполного прогона: пока продолжение возможно (`budget_remains` и `input_can_progress`), поправка не
  # нужна — при любом числе оборотов. Когда продолжать нечем: есть обороты — новый круг, нет — терминал.
  # `blind_cards_ready`: если набора карточек ещё не было, нужны слепые предложения обоих критиков, иначе тупик.
  - из: неполный
    событие: поправка
    условия: {blind_cards_ready: false}
    в: неполный
    отказ: ПОПРАВКА_ТУПИК

  - из: неполный
    событие: поправка
    условия: {blind_cards_ready: true, budget_remains: true, input_can_progress: true}
    в: неполный
    отказ: КОРРЕКЦИЯ_НЕ_НУЖНА

  - из: неполный
    событие: поправка
    условия: {blind_cards_ready: true, turns_left: true, budget_remains: false}
    в: идёт_круг
    действия: [mark_results_stale]

  - из: неполный
    событие: поправка
    условия: {blind_cards_ready: true, turns_left: true, budget_remains: true, input_can_progress: false}
    в: идёт_круг
    действия: [mark_results_stale]

  - из: неполный
    событие: поправка
    условия: {blind_cards_ready: true, turns_left: false, budget_remains: false}
    в: остановлено_для_перепроектирования

  - из: неполный
    событие: поправка
    условия: {blind_cards_ready: true, turns_left: false, budget_remains: true, input_can_progress: false}
    в: остановлено_для_перепроектирования

  - из: идёт_круг
    событие: пакет_закреплён
    условия: {}
    в: идёт_круг

  - из: создан
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [record_reason]
  - из: идёт_круг
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [kill_process_group, mark_results_stale, record_reason]
  - из: ждёт_автора
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [record_reason]
  - из: ждёт_Антона
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [record_reason]
  - из: неполный
    событие: cancel-run
    условия: {}
    в: отменён
    действия: [record_reason]

  # Решения по возражению к постановке. Ревью #11: из `неполный` перехода не
  # было вовсе — а сценарий живой: один критик успел породить возражение,
  # второй сломался, прогон стал `неполный`, Антон принял возражение.
  - из: создан
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку}
    в: создан
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку, round_running: true}
    в: идёт_круг
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку, round_running: false}
    в: идёт_круг
    действия: [recompute_verdict]
  - из: ждёт_автора
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку}
    в: ждёт_автора
    действия: [recompute_verdict]
  - из: ждёт_Антона
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку}
    в: ждёт_Антона
    действия: [recompute_verdict]
  - из: неполный
    событие: submit-framing-decision
    условия: {framing_decision: подтвердить_постановку}
    в: неполный

  - из: создан
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [kill_process_group, mark_results_stale, mark_run_superseded, spawn_linked_run, record_reason]
  - из: ждёт_автора
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: ждёт_Антона
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: неполный
    событие: submit-framing-decision
    условия: {framing_decision: изменить_цель}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]

  - из: создан
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [kill_process_group, mark_results_stale, mark_run_superseded, spawn_linked_run, record_reason]
  - из: ждёт_автора
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: ждёт_Антона
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]
  - из: неполный
    событие: submit-framing-decision
    условия: {framing_decision: сменить_решение}
    в: отменён
    действия: [mark_run_superseded, spawn_linked_run, record_reason]

  - из: создан
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [mark_run_superseded, record_reason]
  - из: идёт_круг
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [kill_process_group, mark_results_stale, mark_run_superseded, record_reason]
  - из: ждёт_автора
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [mark_run_superseded, record_reason]
  - из: ждёт_Антона
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [mark_run_superseded, record_reason]
  - из: неполный
    событие: submit-framing-decision
    условия: {framing_decision: остановить}
    в: отменён
    действия: [mark_run_superseded, record_reason]

# Что каждое действие значит. Движок реализует по одной чистой функции на код.
действия:
  reopen_issue: "issue возвращается в `открыт`"
  record_extra_round: "круг сверх потолка пишется в протокол"
  reset_round_counter: "счётчик кругов стадии обнуляется; бюджет НЕ обнуляется"
  kill_process_group: "убивается вся группа процессов критиков, не только родитель"
  mark_results_stale: "частичные ответы помечаются `устарели`; бюджет списан и не возвращается"
  mark_run_superseded: "поле `действительность` := superseded; состояние прогона не меняется"
  spawn_linked_run: "создаётся новый прогон со ссылкой на прежний, ПОСЛЕ применения перехода"
  recompute_verdict: "вердикт пересчитывается по таблице issues.yaml"
  record_reason: "причина операции пишется в историю"

# Границы отзыва операции. Историю не переписываем никогда.
revoke_operation:
  цель: operation_id
  разрешено_если: "после операции нет зависимых событий"
  зависимое_событие: [смена_состояния_прогона, создан_дочерний_прогон, публикация, последующая_операция_на_ней]
  иначе: ЕСТЬ_ЗАВИСИМЫЕ_СОБЫТИЯ
  компенсация: "переиграть можно только новым решением, видимым в истории"
  отката_истории: false
