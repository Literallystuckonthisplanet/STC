# Стадии и то, ЧТО именно спрашивают у критика (решение Антона 12.08).
#
# Смена центра тяжести. Панель перестаёт быть в первую очередь проверяющей и
# становится ищущей решение. Основание — наш собственный случай: десять кругов
# были добросовестным поиском дыр в решении, которое не следовало выбирать, и
# ни один критик ни разу не сказал «вы согласовываете не тот носитель». Не
# потому что слабые — потому что их об этом не спрашивали.
#
# Механизм провала называется привязкой: покажи модели готовое решение, и она
# начнёт улучшать именно его. Значит спрашивать надо ДО показа.

версия_контракта: 1

стадии:
  идея:
    первый_вопрос: предложи_решение     # вслепую, до показа авторского
    второй_вопрос: сравни_с_предложенным
    итог: сравнение_подходов            # не «одобрено/замечания»
    критиков: 2                          # безусловно, верхние модели
    вызовов_типично: 4                   # 2 слепых + 2 сравнения
    постановка: открыта
    смена_решения: открыта
    buy_vs_build: обязательный_пункт_задания
    область_находок: всё
    возражение_к_постановке: держит_стадию

  план:
    первый_вопрос: найди_непокрытое
    второй_вопрос: null
    итог: вердикт
    критиков: по_риск_профилю
    вызовов_типично: 6
    постановка: закрыта_без_нового_доказательства
    смена_решения: открыта
    buy_vs_build: "находка «стадию идея прошли формально»"
    область_находок: скоуп_круга
    возражение_к_постановке: не_влияет

  ревью:
    первый_вопрос: найди_непокрытое
    второй_вопрос: null
    итог: вердикт
    критиков: по_риск_профилю
    вызовов_типично: 4
    постановка: закрыта
    смена_решения: только_с_новым_доказательством
    buy_vs_build: нет
    область_находок: только_изменённое
    возражение_к_постановке: не_влияет

# Слепой вопрос: что критик видит и чего не видит.
слепой_вопрос:
  показываем: [задача, ограничения, критерий_успеха, уже_закрытые_решения]
  прячем: [предложенное_решение, автор, второй_критик]
  почему: "увидев решение, модель начинает его улучшать вместо того, чтобы спросить, то ли это решение вообще"
  ограничение: "слепое предложение хуже информировано — поэтому контекст в пакет кладётся полностью, прячется только само решение"

# Самый дешёвый сигнал о нежизнеспособности из всех известных.
сигнал_нежизнеспособности:
  условие: оба_критика_независимо_назвали_другой_подход
  действие: сразу_Антону
  до: подсчёта_блокеров
  почему: "два независимых «я бы делал иначе» стоят дешевле любого круга поиска дыр"

# Цена понимания нежизнеспособности — метрика, которую улучшаем.
# У этого проекта она равна «круг 10», и это стоит держать на виду.
метрика_цены_понимания:
  что_пишем: [стадия, круг, потрачено_вызовов, кто_назвал]
  когда: "первое появление сигнала «подход не тот» в прогоне"
  зачем: "чем позже вскрывается негодность решения, тем дороже она обходится — это и есть то, что оптимизируем"
  базовая_точка: {проект: roundtable, стадия: план, круг: 10, источник: пользователь_а_не_панель}

# Приоритет расхода перевёрнут: экономим НЕ на идее.
приоритет_расхода:
  правило: "идея получает двоих критиков и верхние модели безусловно"
  экономим_на: [план, ревью]
  почему: "качественное решение на самом раннем шаге — самая большая экономия; отказ от решения там стоит ноль выброшенной работы"
  отменяет: "прежний риск-профиль, где средняя обратимая задача пропускала стадию идея"

# Исходы стадии «идея» (§4.5 плана): первая подошедшая строка решает; если это
# строка «рисунок_выбора», причину и приоритет даёт подходящий рисунок. Девять
# причин (строки 1-5 и четыре рисунка) сверяются с blocks.списки.исходы_идеи.
# Любой валидный исход идёт в ждёт_Антона: движок сравнивает, но не выбирает.
# Приоритет — целое, у возражения и у строки-рисунка его нет (null).
исходы_идеи:
  строки:
    - {проверка: открытое_возражение, причина: возражение_держит_стадию, приоритет: null}
    - {проверка: оба_нет_проходящего, причина: нет_годного_варианта, приоритет: 1}
    - {проверка: один_нет_проходящего, причина: частичная_негодность, приоритет: 2}
    - {проверка: усиленный_случай, причина: оба_предпочли_неавторскую_и_назвали_авторскую_непроходной, приоритет: 1}
    - {проверка: нет_совокупно_годного, причина: нет_консенсусно_годного, приоритет: 1}
    - {проверка: рисунок_выбора, причина: рисунок, приоритет: null}
  рисунки:
    - {рисунок: обе_одну_авторскую, причина: подтверждён, приоритет: 4}
    - {рисунок: обе_одну_неавторскую, причина: оба_предпочли_неавторскую, приоритет: 2}
    - {рисунок: авторская_и_неавторская, причина: расхождение, приоритет: 3}
    - {рисунок: разные_неавторские, причина: три_подхода_на_столе, приоритет: 3}

# Исполнение стадии «идея». Бюджет повтора тратит только ПОЛУЧЕННЫЙ ответ; вызов,
# оборванный до ответа (процесс упал), в бюджет не идёт, но помечается возможным
# дублем и ограничен этим пределом на критика в фазе — иначе сбой разгонял бы вызовы.
исполнение_идеи:
  предел_прерванных_попыток: 2
