# Roundtable — закрытые перечни. ЕДИНСТВЕННЫЙ источник допустимых значений.
#
# Правило: любое слово, встречающееся в остальных таблицах на позиции статуса,
# состояния, решения или класса, ОБЯЗАНО быть здесь. Обратное тоже верно —
# неиспользуемое значение валит тест. Так рассинхрон между таблицами становится
# падающим тестом, а не находкой платного круга ревью.

версия_контракта: 1

# --- прогон -----------------------------------------------------------------
состояния_прогона:
  рабочие: [создан, идёт_круг, ждёт_автора, ждёт_Антона, неполный]
  терминальные: [завершён, отменён, остановлено_для_перепроектирования]

действительность_прогона: [актуален, superseded]

# --- обычные issue ----------------------------------------------------------
статусы_issue:
  ждут_автора: [открыт, остался]
  ждут_критика: [принят_автором, оспорен_автором]
  ждут_Антона: [вынесен_Антону]
  терминальные:
    - закрыт_исправлением
    - возражение_снято
    - риск_принят
    - остановлено
    - цель_изменена
    - решение_изменено

классы_находки: [блокирующая, неблокирующая, неизвестное, возражение_к_постановке]
устранимость: [правкой, сменой_решения, только_сменой_цели]
существенность: [высокая, низкая]
уверенность: [низкая, средняя, высокая]

# --- решения ----------------------------------------------------------------
# Два набора, разделённых КАНАЛОМ, а не написанием. Три слова совпадают
# (`остановить`, `изменить_цель`, `сменить_решение`) — и это нормально: решение
# всегда квалифицировано каналом, `issue:остановить` и `framing:остановить` —
# разные вещи с разными последствиями. Ревью #11 поймало, что комментарий врал
# про «непересекающиеся», а тест ловил утечку только уникального значения.
# Инвариант правильный: решение исполняется ТОЛЬКО своей операцией.
решения_по_issue:
  - принять_риск
  - остановить
  - сменить_решение
  - изменить_цель
  - запросить_ещё_правку

решения_по_возражению:
  - подтвердить_постановку
  - изменить_цель
  - сменить_решение
  - остановить

# --- возражения к постановке ------------------------------------------------
статусы_возражения:
  активные: [открыто]
  терминальные: [подтверждено, принято, остановлено, породило_новый_прогон]

# --- вердикт ----------------------------------------------------------------
вердикты: [ОДОБРЕНО, НУЖНЫ_ПРАВКИ, РЕШЕНИЕ_АНТОНА, СТОП, НЕПОЛНЫЙ_ПРОГОН]

# --- стадии -----------------------------------------------------------------
стадии:
  в_MVP: [идея, план]
  вне_MVP: [ревью]

# --- доказательства ---------------------------------------------------------
типы_доказательства: [source_span, command_run]

# Отпечаток считается ТОЛЬКО по этим полям. ID и время в него не входят —
# иначе повторная присылка того же фрагмента выглядит новым доказательством.
отпечаток:
  source_span: [хеш_файла, путь, якорь, диапазон_строк]
  command_run: [команда, версия_инструмента, хеш_редакции, код_возврата, хеш_вывода]

# Кто вправе создать запись каждого типа. Критик работает с `--tools ""`,
# поэтому исполнить команду он не может по построению.
создатели_доказательства:
  source_span: [критик, автор, предпроверка]
  command_run: [автор, предпроверка]

# --- операции ---------------------------------------------------------------
операции:
  - precheck
  - publish-check
  - start
  - status
  - submit-revision
  - submit-decision
  - submit-framing-decision
  - resume
  - cancel-run
  - revoke-operation
  - publish

# Операции, не тратящие бюджет и не берущие блокировку прогона.
операции_без_бюджета: [precheck, publish-check, status]

# --- коды условий и действий -------------------------------------------------
# Ревью #11: «условие: "первая смена за стадию; счётчик обнуляется, бюджет нет"»
# — это русское предложение. Программа его не вычислит, значит смысл придётся
# продублировать в Python, и снова получится два источника. Условия и действия
# закрыты перечнями; каждый код — маленькая чистая функция в движке.

коды_условий:
  verdict: [ОДОБРЕНО, НУЖНЫ_ПРАВКИ, РЕШЕНИЕ_АНТОНА, НЕПОЛНЫЙ_ПРОГОН]
  # Два кода, а не один список: канал разделён СТРУКТУРНО. Написать решение по
  # постановке в переходе обычного issue теперь физически нельзя.
  decision: [принять_риск, остановить, сменить_решение, изменить_цель, запросить_ещё_правку]
  framing_decision: [подтвердить_постановку, изменить_цель, сменить_решение, остановить]
  budget_allows_round: [true, false]
  budget_fits_quorum: [true, false]
  change_index: [первая, вторая]
  round_running: [true, false]
  run_finished: [true, false]
  all_verdict_blocking_resolved: [true, false]

коды_действий:
  - reopen_issue
  - record_extra_round
  - reset_round_counter
  - kill_process_group
  - mark_results_stale
  - mark_run_superseded
  - spawn_linked_run
  - recompute_verdict
  - record_reason

# Отказ — тоже исход, и у него есть код. Иначе «операция отвергается»
# оставляет прогон в неопределённом месте (ревью #8 поймало это на второй
# смене решения).
коды_отказа:
  - БЮДЖЕТ_НЕ_ВМЕЩАЕТ_КВОРУМ
  - КОНФЛИКТ_ВХОДА
  - РЕШЕНИЕ_ВНЕ_ТИПА
  - ЕСТЬ_ЗАВИСИМЫЕ_СОБЫТИЯ

# --- схемы ------------------------------------------------------------------
# Контрактные схемы Roundtable. Схема предпроверки живёт отдельно: её создаёт
# и проверяет Б15, который зависит только от Б2 и стоит в плане раньше Б4.
схемы_контрактов:
  - critic_a
  - critic_d
  - author_c
  - anton_e
  - framing_decision
  - issue_b
  - run_state
схемы_вне_контрактов:
  - precheck_frontmatter
