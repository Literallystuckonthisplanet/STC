# Roundtable — закрытые перечни. ЕДИНСТВЕННЫЙ источник допустимых значений.
#
# Правило: любое слово, встречающееся в остальных таблицах на позиции статуса,
# состояния, решения или класса, ОБЯЗАНО быть здесь. Обратное тоже верно —
# неиспользуемое значение валит тест. Так рассинхрон между таблицами становится
# падающим тестом, а не находкой платного круга ревью.

версия_контракта: 1

# --- прогон -----------------------------------------------------------------
состояния_прогона:
  рабочие: [создан, идёт_круг, ждёт_автора, ждёт_Антона, неполный]
  терминальные: [завершён, отменён, остановлено_для_перепроектирования]

действительность_прогона: [актуален, superseded]

# --- обычные issue ----------------------------------------------------------
статусы_issue:
  ждут_автора: [открыт, остался]
  ждут_критика: [принят_автором, оспорен_автором]
  ждут_Антона: [вынесен_Антону]
  терминальные:
    - закрыт_исправлением
    - возражение_снято
    - риск_принят
    - остановлено
    - цель_изменена
    - решение_изменено

классы_находки: [блокирующая, неблокирующая, неизвестное, возражение_к_постановке]
устранимость: [правкой, сменой_решения, только_сменой_цели]
существенность: [высокая, низкая]
уверенность: [низкая, средняя, высокая]

# --- решения ----------------------------------------------------------------
# Два набора, разделённых КАНАЛОМ, а не написанием. Три слова совпадают
# (`остановить`, `изменить_цель`, `сменить_решение`) — и это нормально: решение
# всегда квалифицировано каналом, `issue:остановить` и `framing:остановить` —
# разные вещи с разными последствиями. Ревью #11 поймало, что комментарий врал
# про «непересекающиеся», а тест ловил утечку только уникального значения.
# Инвариант правильный: решение исполняется ТОЛЬКО своей операцией.
решения_по_issue:
  - принять_риск
  - остановить
  - сменить_решение
  - изменить_цель
  - запросить_ещё_правку

решения_по_возражению:
  - подтвердить_постановку
  - изменить_цель
  - сменить_решение
  - остановить

# --- возражения к постановке ------------------------------------------------
статусы_возражения:
  активные: [открыто]
  терминальные: [подтверждено, принято, остановлено, породило_новый_прогон]

# --- вердикт ----------------------------------------------------------------
вердикты: [ОДОБРЕНО, НУЖНЫ_ПРАВКИ, РЕШЕНИЕ_АНТОНА, СТОП, НЕПОЛНЫЙ_ПРОГОН]

# --- стадии -----------------------------------------------------------------
стадии:
  в_MVP: [идея, план]
  вне_MVP: [ревью]

# --- доказательства ---------------------------------------------------------
типы_доказательства: [source_span, command_run]

# Отпечаток считается ТОЛЬКО по этим полям. ID и время в него не входят —
# иначе повторная присылка того же фрагмента выглядит новым доказательством.
отпечаток:
  source_span: [хеш_файла, путь, якорь, диапазон_строк]
  command_run: [команда, версия_инструмента, хеш_редакции, код_возврата, хеш_вывода]

# Кто вправе создать запись каждого типа. Критик работает с `--tools ""`,
# поэтому исполнить команду он не может по построению.
создатели_доказательства:
  source_span: [критик, автор, предпроверка]
  command_run: [автор, предпроверка]

# --- пакет материалов (§6.9) -------------------------------------------------
# Пределы и запреты — данными, иначе они разъедутся с текстом ровно так же, как
# разъезжались таблицы. Числа — стартовые: материал уходит через stdin, и
# ограничитель тут не труба, а окно модели; пересматриваются по замерам.
пакет:
  предел_файла_байт: 262144
  предел_пакета_байт: 1048576
  отвергается:
    - симлинк
    - путь_с_родительским_переходом
    - путь_вне_корня
    - превышение_размера
    - отсутствие_обязательного_файла
  # Не «забыли добавить», а осознанно вне пакета: критик судит артефакт, а не
  # нашу кухню, и не должен видеть ни второго участника, ни автора.
  не_попадает:
    - инструкции_харнесса
    - прошлые_протоколы
    - git_история
    - ответы_других_критиков
    - имя_автора
  реестры: [решения, области, журнал_доказательств]
  виды_решений_в_реестре: [closed_decision, framing]
  # Круг 3: правила пакета — данными, код их только читает.
  # Закрытые схемы записей реестров: лишнее и недостающее поле — отказ.
  схемы_записей:
    решения: [decision_id, kind, text_hash, status]
    области: [area_id]
    журнал_общие: [тип, создатель]
    журнал_необязательные: [id, время]
  # Что слепому видно из реестров: остальное — отказ, а не тихое выбрасывание.
  видимые_слепому_статусы_решений: [закрыто]
  видимые_слепому_создатели: [предпроверка]
  # След скрытого сравнивается по «скелету» текста (только буквы и цифры, без
  # регистра, двойников и невидимых знаков). Скелет длиннее мин_длина_следа ищется
  # срезами этой длины; короче — по основе (без последних знаков, не короче
  # мин_длина_основы), чтобы поймать склонение имени.
  мин_длина_следа: 30
  мин_длина_основы: 4
  # Шаблоны: секреты, ключи, домашние каталоги инструментов. Сравнение по каждому компоненту пути после NFC и casefold.
  запрещённые_пути: [".git", ".claude", ".codex", "CLAUDE.md", "CLAUDE*.md", "AGENTS.md", "AGENTS*.md", "GEMINI*", ".cursor*", ".github", ".gnupg", "codex-home", ".env", ".env.*", ".env*", "*.env", "*.env.*", "*.pem*", "*.key*", ".stc", ".ssh", ".aws", ".docker", ".kube", ".npmrc", ".netrc", ".pypirc", ".pgpass", ".git-credentials", ".gitconfig", ".htpasswd", ".envrc", ".mcp.json", ".claude.json", "settings.local.json", "*secret*", "*credential*", "*password*", "*passwd*", "*apikey*", "*api?key*", "creds*", "*private*", "*keystore*", "*wallet*", "service-account*", "docker-compose*", "database.yml", "*auth*.json", "token", "token.*", "tokens", "tokens.*", "*_token", "*_token.*", "*.token", "id_rsa*", "id_dsa*", "id_ecdsa*", "id_ed25519*", "*.p12", "*.pfx", "*.jks", "*.tfstate*", "*.tfvars", "*.tfvars.json", "service_account*", "serviceAccountKey*", "key.json", "jwt.json", "storage_state*", "session.json", "cookies*", "kubeconfig*", "bearer*", "*access-token*", "*bot-token*", "token_cache*", "compose.yaml", "vault.y*ml", "seed.txt", "mnemonic*", "recovery_codes*", "shadow*", "authorized_keys*", ".auth"]
  # Служебные каталоги ВЫШЕ корня сборки (и сам корень): имя компонента абсолютного пути.
  # Узкий список: полный чёрный список режет системные префиксы вроде /private/var.
  запрещённые_предки: [".git", ".claude", ".codex", ".cursor*", ".github", ".gnupg", ".stc", ".ssh", ".aws", ".docker", ".kube", "codex-home"]
  разрешённые_расширения: [".md", ".txt", ".rst", ".py", ".ts", ".tsx", ".js", ".sql", ".sh", ".yaml", ".yml", ".json", ".toml"]
  # Общие правила (присваивание, URL с паролем, Bearer, JWT, PEM) и форматы известных ключей.
  # Круг 6: присваивание — имя с приставкой и «хвостом» (SECRET_KEY, DB_PASS, dbPass, pwd), в
  # кавычках или без; значение — в кавычках, голое или блочный скаляр YAML (| >-). Значения-выражения
  # не секрет: вызов, индекс, <заполнитель>, ${переменная}, os.environ, *****, required, true/false,
  # None, число, чистый идентификатор. Просмотр вперёд ограничен 200 знаками — иначе повтор
  # «password=» растёт квадратом. Шаблоны не должны возвращаться назад (притяжательные кванторы).
  признаки_секрета:
    - '-----BEGIN [A-Z ]*PRIVATE KEY( BLOCK)?-----'
    - 'PuTTY-User-Key-File'
    - '(AKIA|ASIA)[0-9A-Z]{16}'
    - 'gh[pousr]_[A-Za-z0-9]{36,}'
    - 'sk-[A-Za-z0-9_-]{20,}'
    - 'xox[baprs]-[A-Za-z0-9-]{10,}'
    - 'AIza[\w-]{35}'
    - '\d{8,10}:AA[\w-]{33}'
    - '(npm|glpat|hf|github_pat|sk_live|rk_live|xapp)[_-][\w-]{16,}'
    - '(?<![A-Za-z0-9_])(dckr_pat|lin_api|dop_v1|sntrys|sbp|r8)_[\w+/=-]{20,}'
    - 'ntn_[A-Za-z0-9]{30,}'
    - '(?<![A-Za-z0-9_])re_[A-Za-z0-9]{20,}'
    - 'shp(at|ca|pa|ss)_[A-Fa-f0-9]{32}'
    - 'gsk_[A-Za-z0-9]{20,}'
    - 'pypi-[A-Za-z0-9_-]{20,}'
    - 'ya29\.[\w-]{20,}'
    - 'whsec_[A-Za-z0-9]{16,}'
    - '(?<![A-Za-z0-9])SG\.[\w-]{16,}\.[\w-]{16,}'
    - 'hooks\.slack\.com/services/'
    - 'AccountKey='
