# Roundtable — закрытые перечни. ЕДИНСТВЕННЫЙ источник допустимых значений.
#
# Правило: любое слово, встречающееся в остальных таблицах на позиции статуса,
# состояния, решения или класса, ОБЯЗАНО быть здесь. Обратное тоже верно —
# неиспользуемое значение валит тест. Так рассинхрон между таблицами становится
# падающим тестом, а не находкой платного круга ревью.

версия_контракта: 1

# --- прогон -----------------------------------------------------------------
состояния_прогона:
  рабочие: [создан, идёт_круг, ждёт_автора, ждёт_Антона, неполный]
  терминальные: [завершён, отменён, остановлено_для_перепроектирования]

действительность_прогона: [актуален, superseded]

# --- обычные issue ----------------------------------------------------------
статусы_issue:
  ждут_автора: [открыт, остался]
  ждут_критика: [принят_автором, оспорен_автором]
  ждут_Антона: [вынесен_Антону]
  терминальные:
    - закрыт_исправлением
    - возражение_снято
    - риск_принят
    - остановлено
    - цель_изменена
    - решение_изменено

классы_находки: [блокирующая, неблокирующая, неизвестное, возражение_к_постановке]
устранимость: [правкой, сменой_решения, только_сменой_цели]
существенность: [высокая, низкая]
уверенность: [низкая, средняя, высокая]

# --- решения ----------------------------------------------------------------
# Два набора, разделённых КАНАЛОМ, а не написанием. Три слова совпадают
# (`остановить`, `изменить_цель`, `сменить_решение`) — и это нормально: решение
# всегда квалифицировано каналом, `issue:остановить` и `framing:остановить` —
# разные вещи с разными последствиями. Ревью #11 поймало, что комментарий врал
# про «непересекающиеся», а тест ловил утечку только уникального значения.
# Инвариант правильный: решение исполняется ТОЛЬКО своей операцией.
решения_по_issue:
  - принять_риск
  - остановить
  - сменить_решение
  - изменить_цель
  - запросить_ещё_правку

решения_по_возражению:
  - подтвердить_постановку
  - изменить_цель
  - сменить_решение
  - остановить

# --- возражения к постановке ------------------------------------------------
статусы_возражения:
  активные: [открыто]
  терминальные: [подтверждено, принято, остановлено, породило_новый_прогон]

# --- вердикт ----------------------------------------------------------------
вердикты: [ОДОБРЕНО, НУЖНЫ_ПРАВКИ, РЕШЕНИЕ_АНТОНА, СТОП, НЕПОЛНЫЙ_ПРОГОН]

# --- стадии -----------------------------------------------------------------
стадии:
  в_MVP: [идея, план]
  вне_MVP: [ревью]

# --- доказательства ---------------------------------------------------------
типы_доказательства: [source_span, command_run]

# Отпечаток считается ТОЛЬКО по этим полям. ID и время в него не входят —
# иначе повторная присылка того же фрагмента выглядит новым доказательством.
отпечаток:
  source_span: [хеш_файла, путь, якорь, диапазон_строк]
  command_run: [команда, версия_инструмента, хеш_редакции, код_возврата, хеш_вывода]

# Кто вправе создать запись каждого типа. Критик работает с `--tools ""`,
# поэтому исполнить команду он не может по построению.
создатели_доказательства:
  source_span: [критик, автор, предпроверка]
  command_run: [автор, предпроверка]

# --- пакет материалов (§6.9) -------------------------------------------------
# Пределы и запреты — данными, иначе они разъедутся с текстом ровно так же, как
# разъезжались таблицы. Числа — стартовые: материал уходит через stdin, и
# ограничитель тут не труба, а окно модели; пересматриваются по замерам.
пакет:
  предел_файла_байт: 262144
  предел_пакета_байт: 1048576
  отвергается:
    - симлинк
    - путь_с_родительским_переходом
    - путь_вне_корня
    - превышение_размера
    - отсутствие_обязательного_файла
  # Не «забыли добавить», а осознанно вне пакета: критик судит артефакт, а не
  # нашу кухню, и не должен видеть ни второго участника, ни автора.
  не_попадает:
    - инструкции_харнесса
    - прошлые_протоколы
    - git_история
    - ответы_других_критиков
    - имя_автора
  реестры: [решения, области, журнал_доказательств]
  виды_решений_в_реестре: [closed_decision, framing]
  канонизация: "файлы читаются один раз, пакет сериализуется в канонический JSON без времени сборки — иначе две сборки одного входа дадут разные хеши и гарантия 1 станет непроверяемой"

# --- журнал попыток ---------------------------------------------------------
# Ключ попытки и её состояния (§8.1). Здесь, а не внутри state.py: движок обязан
# читать их из таблицы, иначе смысл снова окажется в двух местах.
попытка:
  ключ: [прогон, стадия, круг, критик, попытка]
  состояния: [подготовлена, запущена, получена, провалидирована, зафиксирована]
  флаг_неопределённого_окна: возможен_дубль
  почему: "вендор ответил, а движок упал до сохранения: гарантия «не обращаться повторно к ответившим» невыполнима, поэтому окно помечается, а не замалчивается"

# --- операции ---------------------------------------------------------------
операции:
  - precheck
  - publish-check
  - start
  - status
  - submit-revision
  - submit-decision
  - submit-framing-decision
  - resume
  - cancel-run
  - revoke-operation
  - publish

# Операции, не тратящие бюджет и не берущие блокировку прогона.
операции_без_бюджета: [precheck, publish-check, status]

# --- коды условий и действий -------------------------------------------------
# Ревью #11: «условие: "первая смена за стадию; счётчик обнуляется, бюджет нет"»
# — это русское предложение. Программа его не вычислит, значит смысл придётся
# продублировать в Python, и снова получится два источника. Условия и действия
# закрыты перечнями; каждый код — маленькая чистая функция в движке.

коды_условий:
  verdict: [ОДОБРЕНО, НУЖНЫ_ПРАВКИ, РЕШЕНИЕ_АНТОНА, НЕПОЛНЫЙ_ПРОГОН]
  # Два кода, а не один список: канал разделён СТРУКТУРНО. Написать решение по
  # постановке в переходе обычного issue теперь физически нельзя.
  decision: [принять_риск, остановить, сменить_решение, изменить_цель, запросить_ещё_правку]
  framing_decision: [подтвердить_постановку, изменить_цель, сменить_решение, остановить]
  budget_allows_round: [true, false]
  budget_fits_quorum: [true, false]
  change_index: [первая, вторая]
  round_running: [true, false]
  run_finished: [true, false]
  all_verdict_blocking_resolved: [true, false]

коды_действий:
  - reopen_issue
  - record_extra_round
  - reset_round_counter
  - kill_process_group
  - mark_results_stale
  - mark_run_superseded
  - spawn_linked_run
  - recompute_verdict
  - record_reason

# Отказ — тоже исход, и у него есть код. Иначе «операция отвергается»
# оставляет прогон в неопределённом месте (ревью #8 поймало это на второй
# смене решения).
коды_отказа:
  - БЮДЖЕТ_НЕ_ВМЕЩАЕТ_КВОРУМ
  - КОНФЛИКТ_ВХОДА
  - РЕШЕНИЕ_ВНЕ_ТИПА
  - ЕСТЬ_ЗАВИСИМЫЕ_СОБЫТИЯ
  # Б1: «все изменяющие операции берут блокировку прогона; параллельный вызов
  # отвергается» (§7) — это исход операции, а у исхода обязан быть код, иначе
  # прогон остаётся в неопределённом месте (тот же довод, что у ревью #8).
  - ПРОГОН_ЗАНЯТ

# --- схемы ------------------------------------------------------------------
# Контрактные схемы Roundtable. Схема предпроверки живёт отдельно: её создаёт
# и проверяет Б15, который зависит только от Б2 и стоит в плане раньше Б4.
схемы_контрактов:
  - critic_a
  - critic_d
  - author_c
  - anton_e
  - framing_decision
  - issue_b
  - run_state
  - idea_proposal
  - idea_comparison
схемы_вне_контрактов:
  - precheck_frontmatter

# --- план работ ---------------------------------------------------------------
# Состояния блока плана. Здесь, а не «как получится в blocks.yaml»: это позиция
# статуса, а значит перечень обязан быть закрытым, как и все остальные.
состояния_блока:
  рабочие: [идёт, переоткрыт, неполный]
  терминальные: [сделано, объединён_с]

# Что блок делает наружу. Нужно машинно: разрешение выдаётся на объём работ,
# и «этот блок зовёт модель» — часть объёма, а не примечание.
внешние_действия: [вызов_модели, запуск_процесса]

# --- стадия «идея» ------------------------------------------------------------
# Причины исхода. Каждая описывает СЛУЧИВШЕЕСЯ, а не вывод о жизнеспособности:
# движок сравнивает ответы критиков и не объявляет их оценку фактом.
оценка_критерия: [pass, fail, unknown]
состояния_кандидата: [годен, непроходной, неясен]
выбор_кандидата_sentinel: нет_проходящего
отношение_механизмов: [same, different, unknown]

# Бюджет повтора невалидного ответа. Без него исполнитель придумывал бы политику
# расхода недельного лимита сам — ровно то, что в этом проекте запрещено.
повтор_невалидного_ответа:
  максимум_на_ответ: 1
  область: на_критика
  тратит_бюджет: true
  порядок: детерминированное_чередование_вендоров
  оба_невалидны: каждому_свой_повтор_затем_НЕПОЛНЫЙ_ПРОГОН
  сохранённый_валидный_ответ_не_повторять: true
  после_исчерпания: НЕПОЛНЫЙ_ПРОГОН
  счётчик_живёт_в: журнал_попыток
